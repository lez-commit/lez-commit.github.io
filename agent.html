<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 演进手札 · 以时间轴为骨，以长文为血肉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="agent/css/base.css?v=20261127g" />
  <link rel="stylesheet" href="agent/css/home.css?v=20261127g" />
  <link rel="stylesheet" href="agent/css/views.css?v=20261127g" />
</head>
<body class="view-home">
  <div class="site-shell" id="site-shell">
    <!-- =====================================================================
         BAND 1: MINIMAL TOP NAVIGATION BAR (~48px)
         ===================================================================== -->
    <header class="top-nav" id="top-nav">
      <button class="mech-avatar-btn" id="mech-avatar-btn" type="button" aria-label="动态机械头像 · 返回首页" title="点击返回首页 · 双击展开机体空中巡检"></button>
      <nav class="nav-links" id="nav-links" aria-label="主导航">
        <button class="nav-btn is-active" type="button" data-view="home">图谱首页</button>
        <button class="nav-btn" type="button" data-view="articles">全部文章</button>
        <button class="nav-btn" type="button" data-view="about">关于</button>
      </nav>
    </header>

    <!-- =====================================================================
         VIEW 1: HOMEPAGE — ZERO-SCROLL 100vh LOCKED
         ===================================================================== -->
    <div class="view-panel home-view is-visible" id="view-home">
      <!-- BAND 2: UPPER OVERVIEW BAND (53-week 1:1 GitHub Publish Graph + Recent Posts) -->
      <section class="bottom-dock" aria-label="发文足迹与最近发布">
        <!-- Left: Pure Publish GitHub Contribution Graph + Inline Readout -->
        <div class="dock-footprint">
          <div class="fp-canvas" id="fp-canvas"></div>
          <span class="fp-readout" id="fp-readout"></span>
        </div>

        <!-- Right: 最近发布 -->
        <aside class="dock-latest" id="dock-latest" aria-label="最近发布"></aside>
      </section>

      <!-- BAND 3: MAIN SKELETON STAGE ("02 · 细枝目录卷") -->
      <main class="skeleton-stage" aria-label="Agent 五时代细枝演进图谱">
        <div class="skeleton-grid" id="skeleton-grid"></div>
        <div class="evo-walker-layer" id="evo-walker-layer" aria-hidden="true"></div>
      </main>
    </div>

    <!-- =====================================================================
         VIEW 2: 「全部文章」 ARCHIVE VIEW
         ===================================================================== -->
    <main class="view-panel archive-view" id="view-articles" aria-label="全部文章归档">
      <div class="narrow-container">
        <header class="subpage-head">
          <h1 class="subpage-title">全部文章</h1>
          <p class="subpage-desc">按演进时代归档 · 点击任意已发布文章直达正文</p>
        </header>
        <div id="archive-content"></div>
      </div>
    </main>

    <!-- =====================================================================
         VIEW 3: 「关于」 ABOUT & SINGLE SOURCE OF TRUTH JSON
         ===================================================================== -->
    <main class="view-panel about-view" id="view-about" aria-label="关于本站">
      <div class="narrow-container">
        <header class="subpage-head">
          <h1 class="subpage-title">关于 · 单一数据源学习法</h1>
          <p class="subpage-desc">Agent 演进手札的设计哲学与底层图谱基因</p>
        </header>

        <div class="about-text">
          <p>
            面对层出不穷的 AI Agent 新概念，最容易陷入的是碎片化焦虑。本站坚持用<strong>「演进时间轴」</strong>作为不变的骨架——每一次技术范式跃迁，本质上都是为了修补上一代撞上的墙。
          </p>
          <p>
            首页的 5 栏细枝图谱、文章归档与底部竹青足迹，全部由同一份结构化数据 <code>AGENT_MAP_DATA</code> 驱动。每次准备规划下一阶段学习时，只需复制下方 JSON 骨架，就能精准知道已写完哪些节点、下一步该往哪根枝桠长出血肉。
          </p>
        </div>

        <section class="json-box-wrap" aria-label="AGENT_MAP_DATA JSON 骨架">
          <div class="json-bar">
            <span class="json-label">AGENT_MAP_DATA.json</span>
            <button class="copy-btn" id="btn-copy-json" type="button">一键复制 JSON</button>
          </div>
          <pre class="json-pre" id="json-pre"></pre>
        </section>
      </div>
    </main>

    <!-- =====================================================================
         VIEW 4: ARTICLE READER VIEW
         ===================================================================== -->
    <main class="view-panel reader-view" id="view-reader" aria-label="文章阅读">
      <div class="reader-bar">
        <button class="back-link" id="btn-back-map" type="button">← 返回演进图谱</button>
        <span class="coord-tag" id="reader-coord-tag"></span>
      </div>
      <article class="reader-body" id="reader-body"></article>
    </main>
  </div>

  <!-- Full-Viewport Twin-Eye Scanner Overlay -->
  <svg class="mech-scan-overlay" id="mech-scan-overlay" aria-hidden="true"></svg>

  <!-- Quiet Floating Tooltip -->
  <div class="quiet-tip" id="quiet-tip" role="tooltip"></div>


  <script src="agent/js/data.js?v=20261127g"></script>
  <script src="agent/js/app.js?v=20261127g"></script>
  <script src="agent/js/mech-avatar.js?v=20261127g"></script>
  <script src="agent/js/evo-walker.js?v=20261127g"></script>
</body>
</html>
