            let freezeAll = false;
            let headNodDeg = 0;
            let armPose = "walk"; // "walk" | "cot" | "bonk" | "wrench" | "press" | "dock" | "launch"
            let pincerSnap = 0;
            let bodyRollDeg = 0;
            let bodyDropY = 0;
            let isSliding = false;
            let launchLiftY = 0;
            let crouchY = 0;
            let jetPower = 0;

            if (b1 === 0) {
              // Era 1: brisk light jog approach
              extraLean = 10;
            }

            if (clickHopTimer > 0 && b5 !== 3) {
              clickHopTimer = Math.max(0, clickHopTimer - dt);
              moveSpeed = 0;
              beatHopH = Math.sin((clickHopTimer / 0.5) * Math.PI) * 7.5;
            } else if (b1 === 1) {
              // Era 1 Step 1: Jog-trip over 5px pebble, launching into flat belly-slide
              b1t += dt;
              const u = clamp01(b1t / 0.22);
              posX += 116 * dt;
              moveSpeed = 0;
              beatHopH = Math.sin(u * Math.PI) * 5.8;
              bodyRollDeg = u * 84;
              bodyDropY = u * 3.0;
              pincerSnap = 0.9;
              if (b1t >= 0.22) { b1 = 2; b1t = 0; }
            } else if (b1 === 2) {
              // Era 1 Step 2: Long friction belly-slide across Era 1 -> Era 2 border
              b1t += dt;
              const slideTargetX = startX + span * 0.225;
              const u = clamp01(b1t / 1.15);
              const slideSpeed = lerp(142, 36, u * u);
              posX += slideSpeed * dt;
              moveSpeed = 0;
              bodyRollDeg = 84;
              bodyDropY = 3.2;
              isSliding = true;
              if (posX >= slideTargetX || b1t >= 1.20) { b1 = 3; b1t = 0; }
            } else if (b1 === 3) {
              // Era 1 Step 3: Pop cleanly upright inside Era 2
              b1t += dt;
              const u = clamp01(b1t / 0.34);
              const ease = u * u * (3 - 2 * u);
              posX += lerp(30, 54, ease) * dt;
              moveSpeed = lerp(30, 54, ease);
              bodyRollDeg = lerp(84, 0, ease);
              bodyDropY = lerp(3.2, 0, ease);
              beatHopH = Math.sin(u * Math.PI) * 2.8;
              if (b1t >= 0.34) b1 = 4;
            } else if (b2 === 1) {
              // Era 2 Beat: stop at wooden study desk, CoT chin-prop + read lifted paper + nod
              b2t += dt;
              moveSpeed = 0;
              armPose = "cot";
              extraLean = 6;
              headNodDeg = b2t > 0.35 ? Math.sin((b2t - 0.35) * 18) * 9 : 4;
              if (b2t >= 0.92) b2 = 2;
            } else if (b3 === 1) {
              // Era 3 Beat: BONK into tall brick wall -> recoil -> morph wrench -> turn bolt 90° -> wall sinks!
              b3t += dt;
              moveSpeed = 0;
              if (b3t < 0.38) {
                // Bonk & recoil backward (-18° lean, hand on forehead)
                const u = b3t / 0.38;
                visualDX = -Math.sin(u * Math.PI * 0.5) * 9;
                extraLean = -34 * (1 - u * 0.4);
                armPose = "bonk";
              } else if (b3t < 0.72) {
                // Step up & click forearm into wrench jaw
                const u = (b3t - 0.38) / 0.34;
                visualDX = lerp(-9, -1.5, u);
                extraLean = lerp(-18, 6, u);
                armPose = "wrench";
              } else if (b3t < 1.02) {
                // Turn cross bolt 90°!
                const u = (b3t - 0.72) / 0.30;
                visualDX = -1.5;
                extraLean = 6;
                armPose = "wrench";
                wallBoltDeg = u * 90;
              } else {
                // Brick wall smoothly sinks into ground (leaving 2px sill)
                const u = clamp01((b3t - 1.02) / 0.38);
                const ease = u * u * (3 - 2 * u);
                visualDX = -1.5;
                extraLean = 2;
                armPose = "wrench";
                wallBoltDeg = 90;
                wallSink = ease * 26;
              }
              if (b3t >= 1.40) {
                wallSink = 26;
                b3 = 2;
              }
            } else if (b4 === 1) {
              // Era 4 Beat: brake before gate -> press checkpoint button -> 0.25s stateless freeze -> gate lifts 75°
              b4t += dt;
              moveSpeed = 0;
              if (b4t < 0.28) {
                armPose = "press";
              } else if (b4t < 0.53) {
                // Stateless interrupt freeze (0.25s completely still!)
                armPose = "press";
                freezeAll = true;
              } else {
                // Bamboo saved dot lights + gate arm swings up 75°
                const u = clamp01((b4t - 0.53) / 0.42);
                const ease = 1 - Math.pow(1 - u, 3);
                gateAngle = ease * 75;
                armPose = "walk";
              }
              if (b4t >= 0.98) {
                gateAngle = 75;
                b4 = 2;
              }
            } else if (b5 === 1) {
              // Era 5 Beat A: Modular Armor Convergence (7 pieces fly in from all directions & lock on!)
              b5t += dt;
              moveSpeed = 0;
              armPose = "dock";
              // Crisp physical weight-settle recoil on each wave lock-in (0.34, 0.52, 0.72, 0.88)
              const waveImpacts = [0.34, 0.52, 0.72, 0.88];
              let recoil = 0;
              for (let i = 0; i < waveImpacts.length; i++) {
                const d = b5t - waveImpacts[i];
                if (d >= 0 && d < 0.12) recoil += Math.sin((d / 0.12) * Math.PI) * 1.35;
              }
              crouchY = recoil;
              if (b5t >= 0.88 && !isEquipped) {
                isEquipped = true;
                claspRippleTimer = 0.70;
                lockSparkTimer = 0.26;
              }
              if (b5t >= 0.88) {
                headNodDeg = Math.sin(clamp01((b5t - 0.88) / 0.30) * Math.PI) * 9;
              }
              if (b5t >= 1.22) b5 = 2;
            } else if (b5 === 3) {
              // Era 5 Beat B: Iron Man palms-down repulsor ignition -> hover -> sonic ring -> rocket UP out of window!
              b5t += dt;
              moveSpeed = 0;
              armPose = "launch";
              if (b5t < 0.34) {
                // Heroic crouch + palm repulsor pre-ignition
                const u = clamp01(b5t / 0.34);
                crouchY = Math.sin(u * Math.PI * 0.5) * 2.8;
                jetPower = u * 0.9;
              } else if (b5t < 0.68) {
                // Smooth lift into stable Iron Man low hover (11px off spine + gentle micro-bob)
                const u = clamp01((b5t - 0.34) / 0.34);
                crouchY = lerp(2.8, 0, clamp01(u * 3));
                const ease = 1 - Math.pow(1 - u, 3);
                launchLiftY = ease * 11 + Math.sin(u * Math.PI * 3) * 0.6;
                jetPower = 1.0 + u * 0.25;
              } else {
                // Full blastoff: sonic ring pops & robot accelerates across the full viewport out the top!
                const au = clamp01((b5t - 0.68) / 0.94);
                crouchY = 0;
                launchLiftY = 11 + Math.pow(au, 2.45) * 860;
                jetPower = 1.35 + au * 1.35;
              }
              if (b5t >= 1.62) {
                resetWaitTimer = 1.6;
                if (typeof window.__onMechExitedTop === "function") {
                  window.__onMechExitedTop();
                }
              }
            } else {
              posX += baseSpeed * dt;
            }

            if (claspRippleTimer > 0) claspRippleTimer = Math.max(0, claspRippleTimer - dt);
            if (lockSparkTimer > 0) lockSparkTimer = Math.max(0, lockSparkTimer - dt);

            if (posX >= endX && b5 !== 3) {
              resetWaitTimer = 1.4;
            }

            const drawX = posX + visualDX;

            // =================================================================
            // SPOTLIGHT RESTRAINT RULE: Idle watermark (0.26, #8C8478) -> Active (0.92, #1D1B18)
            // =================================================================
            const setPropFocus = (el, px) => {
              const near = clamp01(1 - Math.abs(drawX - px) / 80);
              el.setAttribute("transform", `translate(${px.toFixed(1)}, ${BASE_Y})`);
              el.setAttribute("opacity", (0.26 + near * 0.66).toFixed(2));
              el.setAttribute("color", near > 0.25 ? "#1D1B18" : "#8C8478");
              return near;
            };

            setPropFocus(prop1, x1);
            const near2 = setPropFocus(prop2, x2);
            setPropFocus(prop3, x3);
            setPropFocus(prop4, x4);
            setPropFocus(prop5, x5);

            // Prop 2 updates: lamp cone + paper lift ONLY during Era 2 reading
            const readingNow = b2 === 1 && b2t > 0.12 && b2t < 0.84;
            lampCone.setAttribute("opacity", readingNow ? "1" : "0");
            lampBulb.setAttribute("opacity", readingNow ? "1" : "0");
            const liftY = readingNow ? -Math.sin(clamp01((b2t - 0.15) / 0.65) * Math.PI) * 3.2 : 0;
            deskPaperLift.setAttribute("transform", `translate(0, ${liftY.toFixed(1)})`);

            // Prop 3 updates: bolt rotation, sinking wall, bonk vermilion sparks
            wallBody.setAttribute("transform", `translate(0, ${wallSink.toFixed(1)})`);
            wallBolt.setAttribute("transform", `rotate(${wallBoltDeg.toFixed(1)}, 0, -15)`);
            const showBonk = b3 === 1 && b3t < 0.32;
            wallSparks.setAttribute("opacity", showBonk ? (1 - b3t / 0.32).toFixed(2) : "0");

            // Prop 4 updates: button depression, bamboo dot, barrier arm lift
            const btnPressed = b4 === 1 && b4t >= 0.20 && b4t <= 0.56;
            gateBtnEl.setAttribute("y", btnPressed ? "-17.2" : "-18.4");
            gateArmGroup.setAttribute("transform", `rotate(${gateAngle.toFixed(1)}, 0, -13)`);
            gateSavedDot.setAttribute("opacity", gateAngle > 2 || (b4 === 1 && b4t >= 0.50) ? "1" : "0");

            // Prop 5 updates: Harness Summon Pad core + alignment ticks
            const padActive = b5 === 1 || isEquipped;
            padCore.setAttribute("opacity", padActive ? "1" : "0");
            padBeams.setAttribute("opacity", b5 === 1 && b5t < 0.90 ? (0.45 + 0.35 * Math.sin(b5t * 24)).toFixed(2) : "0");

            // Stage 5 Flying Modular Parts convergence animation (during b5 === 1)
            if (b5 === 1 && b5t < 0.94) {
              assembleLayer.setAttribute("opacity", "1");
              flyParts.forEach(({ sp, trail, piece }) => {
                if (b5t >= sp.t0 && b5t < sp.t1) {
                  const rawU = clamp01((b5t - sp.t0) / (sp.t1 - sp.t0));
                  // Magnetic pull-in acceleration: zips in & snaps hard!
                  const u = Math.pow(rawU, 1.65);
                  const inv = 1 - u;
                  const px = inv * inv * sp.sx + 2 * inv * u * sp.cx + u * u * sp.tx;
                  const py = inv * inv * sp.sy + 2 * inv * u * sp.cy + u * u * sp.ty;
                  const rot = sp.rot0 * (1 - u);
                  const fadeIn = clamp01(rawU * 4.5);
                  piece.setAttribute("transform", `translate(${px.toFixed(1)}, ${py.toFixed(1)}) rotate(${rot.toFixed(1)})`);
                  piece.setAttribute("opacity", fadeIn.toFixed(2));
                  // Trailing speed-line behind flying part
                  const prevU = Math.max(0, u - 0.22);
                  const pinv = 1 - prevU;
                  const tx0 = pinv * pinv * sp.sx + 2 * pinv * prevU * sp.cx + prevU * prevU * sp.tx;
                  const ty0 = pinv * pinv * sp.sy + 2 * pinv * prevU * sp.cy + prevU * prevU * sp.ty;
                  trail.setAttribute("x1", tx0.toFixed(1));
                  trail.setAttribute("y1", ty0.toFixed(1));
                  trail.setAttribute("x2", px.toFixed(1));
                  trail.setAttribute("y2", py.toFixed(1));
                  trail.setAttribute("opacity", (fadeIn * 0.55).toFixed(2));
                } else {
                  piece.setAttribute("opacity", "0");
                  trail.setAttribute("opacity", "0");
                }
              });
            } else {
              assembleLayer.setAttribute("opacity", "0");
            }
            lockSparks.setAttribute("opacity", lockSparkTimer > 0 ? (lockSparkTimer / 0.26).toFixed(2) : "0");

            // Ground shockwave, sonic boom ring & triple contrails during Iron Man blastoff
            if (b5 === 3 && b5t > 0.12) {
              const su = clamp01((b5t - 0.12) / 0.52);
              if (su < 1) {
                const spread = 4 + su * 22;
                const len = 5.5 * (1 - su * 0.45);
                shockL.setAttribute("x1", (launchX - spread - len).toFixed(1));
                shockL.setAttribute("x2", (launchX - spread).toFixed(1));
                shockL.setAttribute("y1", String(BASE_Y - 1));
                shockL.setAttribute("y2", String(BASE_Y - 1));
                shockR.setAttribute("x1", (launchX + spread).toFixed(1));
                shockR.setAttribute("x2", (launchX + spread + len).toFixed(1));
                shockR.setAttribute("y1", String(BASE_Y - 1));
                shockR.setAttribute("y2", String(BASE_Y - 1));
                launchShock.setAttribute("opacity", ((1 - su) * 0.70).toFixed(2));
              } else {
                launchShock.setAttribute("opacity", "0");
              }
              // Sonic boom ring pops right at hover->blastoff transition (0.66s..1.04s)
              if (b5t >= 0.66 && b5t < 1.04) {
                const ru = (b5t - 0.66) / 0.38;
                sonicRing.setAttribute("cx", launchX.toFixed(1));
                sonicRing.setAttribute("cy", String(BASE_Y - 12));
                sonicRing.setAttribute("rx", (6 + ru * 18).toFixed(1));
                sonicRing.setAttribute("ry", (1.8 + ru * 3.8).toFixed(1));
                sonicRing.setAttribute("opacity", ((1 - ru) * 0.72).toFixed(2));
              } else {
                sonicRing.setAttribute("opacity", "0");
              }
              if (launchLiftY > 8) {
                const trailOp = clamp01(1 - (launchLiftY - 45) / 185) * 0.45;
                const topY = (BASE_Y - launchLiftY - 4).toFixed(1);
                launchTrail.setAttribute("x1", launchX.toFixed(1));
                launchTrail.setAttribute("x2", launchX.toFixed(1));
                launchTrail.setAttribute("y1", String(BASE_Y - 2));
                launchTrail.setAttribute("y2", topY);
                launchTrail.setAttribute("opacity", trailOp.toFixed(2));
                launchTrailL.setAttribute("x1", (launchX - 7).toFixed(1));
                launchTrailL.setAttribute("x2", (launchX - 7).toFixed(1));
                launchTrailL.setAttribute("y1", String(BASE_Y - 6));
                launchTrailL.setAttribute("y2", (BASE_Y - launchLiftY - 12).toFixed(1));
                launchTrailL.setAttribute("opacity", (trailOp * 0.7).toFixed(2));
                launchTrailR.setAttribute("x1", (launchX + 7).toFixed(1));
                launchTrailR.setAttribute("x2", (launchX + 7).toFixed(1));
                launchTrailR.setAttribute("y1", String(BASE_Y - 6));
                launchTrailR.setAttribute("y2", (BASE_Y - launchLiftY - 12).toFixed(1));
                launchTrailR.setAttribute("opacity", (trailOp * 0.7).toFixed(2));
              } else {
                launchTrail.setAttribute("opacity", "0");
                launchTrailL.setAttribute("opacity", "0");
                launchTrailR.setAttribute("opacity", "0");
              }
            } else {
              launchShock.setAttribute("opacity", "0");
              sonicRing.setAttribute("opacity", "0");
              launchTrail.setAttribute("opacity", "0");
              launchTrailL.setAttribute("opacity", "0");
              launchTrailR.setAttribute("opacity", "0");
            }

            // =================================================================
            // CONTINUOUS MORPHOLOGY EVOLUTION (17px -> 23px -> 26px -> 29px -> 33px)
            // =================================================================
            const headW = smooth(0.72, 1.15, evo);       // Boxy CRT head pops out entering Era 2
            const kneeW = smooth(0.75, 1.25, evo);       // Articulated knees unfold in Era 2
            const wrenchW = b3 === 1 ? smooth(0.45, 0.68, b3t) : (b3 === 2 && !isEquipped ? 1 : 0);
            const gogglesW = smooth(2.65, 3.05, evo);    // Era 4–5 dual-optic visor
            const keyW = 1 - smooth(0.72, 1.05, evo);    // Era 1 wind-up key fades out
            const edgeFade = b5 === 3 ? 1 : smooth(0, 0.03, progress) * (1 - smooth(0.96, 1, progress));

            // Proportions: total height scales smoothly 17 -> 23 -> 26 -> 29 -> 33px
            const legSeg = lerp(3.4, 7.2, smooth(0.2, 3.4, evo));
            const strideLen = lerp(6.0, 14.0, smooth(0.2, 3.6, evo));
            const torsoH = lerp(7.8, 10.6, smooth(0.4, 3.4, evo));
            const torsoW = lerp(11.6, 8.2, smooth(0.5, 3.2, evo));

            if (!freezeAll && moveSpeed > 0) {
              phase += (moveSpeed / Math.max(9, strideLen * 1.95)) * dt;
              keyPhase += 5.2 * dt;
            }

            // Spinal lean arc: +22° -> +5° -> +28° -> +6° -> 0°
            const baseLean =
              evo < 1
                ? lerp(22, 6, smooth(0.5, 1.0, evo))
                : evo < 2
                ? lerp(6, 26, smooth(1.45, 2.0, evo))
                : evo < 3
                ? lerp(26, 6, smooth(2.2, 2.9, evo))
                : lerp(6, 0, smooth(3.1, 3.65, evo));
            const leanDeg = b5 === 3 ? 0 : baseLean + extraLean;
            const leanRad = (leanDeg * Math.PI) / 180;

            const bob = freezeAll || b5 === 3 ? 0 : kneeW * Math.abs(Math.sin(phase * Math.PI * 2)) * 1.4;
            const totalLift = beatHopH + launchLiftY;
            const hipY = -lerp(6.4, 13.0, smooth(0.2, 3.4, evo)) - bob - totalLift + crouchY;
            const shoulderX = Math.sin(leanRad) * torsoH;
            const shoulderY = hipY - Math.cos(leanRad) * torsoH;

            botGroup.setAttribute("transform", `translate(${drawX.toFixed(2)}, ${BASE_Y})`);
            botGroup.setAttribute("opacity", edgeFade.toFixed(3));
            if (Math.abs(bodyRollDeg) > 0.1 || Math.abs(bodyDropY) > 0.1) {
              const pivotY = isSliding ? -4.5 : -7.5;
              botBody.setAttribute("transform", `translate(0, ${bodyDropY.toFixed(2)}) rotate(${bodyRollDeg.toFixed(1)}, 0, ${pivotY})`);
            } else {
              botBody.removeAttribute("transform");
            }
            const shadowBaseRx = lerp(7.2, 5.8, smooth(0.5, 3.2, evo));
            const shadowScale = clamp01(1 - totalLift / 48);
            shadowEl.setAttribute("rx", ((isSliding ? 9.6 : shadowBaseRx) * (0.4 + 0.6 * shadowScale)).toFixed(1));
            shadowEl.setAttribute("fill-opacity", (0.12 * shadowScale).toFixed(3));

            // Era 1 wind-up key on back + trip vermilion `!`
            keyGroup.setAttribute("opacity", keyW.toFixed(2));
            if (keyW > 0.02) {
              const keyShudder = b1 === 1 ? Math.sin(b1t * 48) * 1.2 : 0;
              keyGroup.setAttribute("transform", `translate(${keyShudder.toFixed(1)}, ${hipY.toFixed(1)}) rotate(${leanDeg.toFixed(1)})`);
              keyLoop.setAttribute("ry", (1.2 + Math.abs(Math.cos(keyPhase)) * 2.2).toFixed(2));
            }
            stuckBang.setAttribute("opacity", b1 === 1 ? "0.95" : "0");

            // Legs: Era 1 jog/slide -> Era 2–5 articulated IK gait -> Iron Man flight pose
            const liftH = b1 === 0 ? 2.4 : lerp(0.5, 3.6, kneeW);
            const isFlying = b5 === 3 && launchLiftY > 2;
            const f1 = isSliding
              ? { x: -3.8, y: -1.4, pitch: 0 }
              : isFlying
              ? { x: 1.4, y: 0.4, pitch: 0.28 }
              : moveSpeed > 0
              ? footPose(phase, strideLen, liftH)
              : { x: 2.2, y: 0, pitch: 0 };
            const f2 = isSliding
              ? { x: -1.8, y: -0.6, pitch: 0 }
              : isFlying
              ? { x: -2.2, y: -2.6, pitch: 0.35 }
              : moveSpeed > 0
              ? footPose(phase + 0.5, strideLen, liftH)
              : { x: -2.2, y: 0, pitch: 0 };

            if (kneeW < 0.15) {
              // Stiff knee-less RPA stick legs
              frontLeg.setAttribute("d", `M 1.5,${hipY.toFixed(1)} L ${(f1.x + 1.5).toFixed(1)},${(f1.y - beatHopH).toFixed(1)}`);
              backLeg.setAttribute("d", `M -1.5,${hipY.toFixed(1)} L ${(f2.x - 1.5).toFixed(1)},${(f2.y - beatHopH).toFixed(1)}`);
              frontFoot.setAttribute("d", `M ${(f1.x + 1.5).toFixed(1)},${(f1.y - beatHopH).toFixed(1)} l 2.4,0`);
              backFoot.setAttribute("d", `M ${(f2.x - 1.5).toFixed(1)},${(f2.y - beatHopH).toFixed(1)} l 2.2,0`);
            } else {
              const k1 = solveKnee(0, hipY, f1.x, f1.y - totalLift, legSeg, legSeg);
              const k2 = solveKnee(0, hipY, f2.x, f2.y - totalLift, legSeg, legSeg);
              frontLeg.setAttribute("d", `M 0,${hipY.toFixed(1)} L ${k1.x.toFixed(1)},${k1.y.toFixed(1)} L ${f1.x.toFixed(1)},${(f1.y - totalLift).toFixed(1)}`);
              backLeg.setAttribute("d", `M 0,${hipY.toFixed(1)} L ${k2.x.toFixed(1)},${k2.y.toFixed(1)} L ${f2.x.toFixed(1)},${(f2.y - totalLift).toFixed(1)}`);
              frontFoot.setAttribute("d", `M ${f1.x.toFixed(1)},${(f1.y - totalLift).toFixed(1)} l 3.0,${(f1.pitch * 3.2).toFixed(1)}`);
              backFoot.setAttribute("d", `M ${f2.x.toFixed(1)},${(f2.y - totalLift).toFixed(1)} l 2.8,${(f2.pitch * 3.2).toFixed(1)}`);
              kneeJoint1.setAttribute("cx", k1.x.toFixed(1));
              kneeJoint1.setAttribute("cy", k1.y.toFixed(1));
              kneeJoint1.setAttribute("opacity", kneeW.toFixed(2));
              kneeJoint2.setAttribute("cx", k2.x.toFixed(1));
              kneeJoint2.setAttribute("cy", k2.y.toFixed(1));
              kneeJoint2.setAttribute("opacity", (kneeW * 0.62).toFixed(2));
            }
            if (kneeW < 0.15) {
              kneeJoint1.setAttribute("opacity", "0");
              kneeJoint2.setAttribute("opacity", "0");
            }
            backLeg.setAttribute("opacity", "0.62");
            backFoot.setAttribute("opacity", "0.62");

            // Torso (robotic chassis box with panel vents)
            const hw = torsoW * 0.5;
            const topW = lerp(hw * 0.90, hw * 0.96, smooth(0.8, 3.2, evo));
            torsoEl.setAttribute("d", `M ${(-hw).toFixed(1)},0 L ${hw.toFixed(1)},0 L ${topW.toFixed(1)},${(-torsoH).toFixed(1)} L ${(-topW).toFixed(1)},${(-torsoH).toFixed(1)} Z`);
            chestPanel.setAttribute("d", `M ${(-hw * 0.45).toFixed(1)},${(-torsoH * 0.62).toFixed(1)} L ${(hw * 0.45).toFixed(1)},${(-torsoH * 0.62).toFixed(1)} M ${(-hw * 0.35).toFixed(1)},${(-torsoH * 0.38).toFixed(1)} L ${(hw * 0.35).toFixed(1)},${(-torsoH * 0.38).toFixed(1)}`);
            chestPanel.setAttribute("opacity", isEquipped ? "0" : "0.55");
            torsoGroup.setAttribute("transform", `translate(0, ${hipY.toFixed(2)}) rotate(${leanDeg.toFixed(1)})`);

            // Era 5 Staggered Modular Armor Lock-in Flags (Boots -> Gauntlets -> Torso/Pack -> Head Crest)
            const hasBoots = isEquipped || (b5 === 1 && b5t >= 0.34);
            const hasGauntlets = isEquipped || (b5 === 1 && b5t >= 0.52);
            const hasTorsoArmor = isEquipped || (b5 === 1 && b5t >= 0.72);
            const hasHeadCrest = isEquipped || (b5 === 1 && b5t >= 0.88);

            // Armored Thruster Boots track front & back feet
            bootF.setAttribute("opacity", hasBoots ? "1" : "0");
            bootB.setAttribute("opacity", hasBoots ? "0.75" : "0");
            if (hasBoots) {
              bootF.setAttribute("transform", `translate(${f1.x.toFixed(1)}, ${(f1.y - totalLift).toFixed(1)})`);
              bootB.setAttribute("transform", `translate(${f2.x.toFixed(1)}, ${(f2.y - totalLift).toFixed(1)})`);
            }

            // Modular Skills Jetpack + Shoulder Pauldrons + X-Harness + Bamboo Arc Core
            jetpackEl.setAttribute("opacity", hasTorsoArmor ? "1" : "0");
            shoulderArmorEl.setAttribute("opacity", hasTorsoArmor ? "1" : "0");
            harnessGroup.setAttribute("opacity", hasTorsoArmor ? "1" : "0");
            if (hasTorsoArmor) {
              harnessX1.setAttribute("x1", (-topW + 0.6).toFixed(1));
              harnessX1.setAttribute("y1", (-torsoH + 0.8).toFixed(1));
              harnessX1.setAttribute("x2", (hw - 0.6).toFixed(1));
              harnessX1.setAttribute("y2", "-1.2");
              harnessX2.setAttribute("x1", (topW - 0.6).toFixed(1));
              harnessX2.setAttribute("y1", (-torsoH + 0.8).toFixed(1));
              harnessX2.setAttribute("x2", (-hw + 0.6).toFixed(1));
              harnessX2.setAttribute("y2", "-1.2");
              const cy = (-torsoH * 0.52).toFixed(1);
              harnessClasp.setAttribute("cx", "0");
              harnessClasp.setAttribute("cy", cy);
              if (claspRippleTimer > 0) {
                const rp = 1 - claspRippleTimer / 0.70;
                harnessRipple.setAttribute("cx", "0");
                harnessRipple.setAttribute("cy", cy);
                harnessRipple.setAttribute("r", (1.8 + rp * 7.2).toFixed(1));
                harnessRipple.setAttribute("opacity", ((1 - rp) * 0.90).toFixed(2));
                const rp2 = clamp01((rp - 0.18) / 0.82);
                harnessRipple2.setAttribute("cx", "0");
                harnessRipple2.setAttribute("cy", cy);
                harnessRipple2.setAttribute("r", (1.6 + rp2 * 10.5).toFixed(1));
                harnessRipple2.setAttribute("opacity", (rp2 > 0 ? (1 - rp2) * 0.55 : 0).toFixed(2));
              } else {
                harnessRipple.setAttribute("opacity", "0");
                harnessRipple2.setAttribute("opacity", "0");
              }
            }

            // Robot Head (boxy CRT chassis + proud upright antenna + visor + Stage 5 Mech V-Crest)
            headGroup.setAttribute("opacity", headW.toFixed(3));
            const hScale = lerp(0.3, 0.96, headW) * lerp(1.06, 0.92, smooth(1.3, 3.5, evo));
            const headX = shoulderX + 0.6;
            const headY = shoulderY - 4.6 * hScale - 0.8;
            const walkTilt = freezeAll || b5 === 3 ? 0 : Math.sin(phase * Math.PI * 2) * 2.0;
            const launchLookUp = b5 === 3 && launchLiftY > 2 ? -8 : 0;
            headGroup.setAttribute("transform", `translate(${headX.toFixed(2)}, ${headY.toFixed(2)}) scale(${hScale.toFixed(3)}) rotate(${(walkTilt + headNodDeg + launchLookUp).toFixed(1)})`);

            antGroup.setAttribute("transform", `rotate(${(Math.sin(phase * Math.PI * 2) * 5).toFixed(1)}, -0.8, -4.6)`);
            antTip.setAttribute("fill", hasHeadCrest ? "#2D6A47" : "#FAF8F4");
            headCrestEl.setAttribute("opacity", hasHeadCrest ? "1" : "0");

            if (!freezeAll) {
              blinkTimer -= dt;
              if (blinkTimer <= 0) {
                isBlinking = !isBlinking;
                blinkTimer = isBlinking ? 0.11 : 2.6 + Math.random() * 2.6;
              }
            }
            visorScreen.setAttribute("opacity", gogglesW > 0.5 ? "0" : "1");
            eyeEl.setAttribute("opacity", gogglesW > 0.5 ? "0" : "1");
            eyeEl.setAttribute("r", isBlinking ? "0.18" : "1.1");
            gogglesEl.setAttribute("opacity", gogglesW.toFixed(2));
            goggleEye.setAttribute("opacity", gogglesW > 0.5 && !isBlinking ? "1" : "0");

            // Arms & Props (Pincer / CoT Chin / Forehead Bonk / Wrench / Gate Press / Suit-Up / Iron Man Launch)
            const swing = moveSpeed > 0 ? Math.sin(phase * Math.PI * 2) * lerp(1.5, 5.5, kneeW) : 0;
            const armLen = lerp(5.8, 8.8, smooth(0.4, 3.4, evo));
            let fHX = shoulderX + swing + 2;
            let fHY = shoulderY + armLen - Math.abs(swing) * 0.2;
            let bHX = shoulderX - swing;
            let bHY = shoulderY + armLen - Math.abs(swing) * 0.2;

            if (evo < 0.8) {
              // Era 1: rigid fixed-height straight horizontal C-pincer arm
              fHX = shoulderX + 7.2;
              fHY = shoulderY + 2.2;
              bHX = shoulderX - 1.5;
              bHY = shoulderY + 5.2;
            } else if (armPose === "cot") {
              // Era 2: left hand props chin, right hand lifts paper
              bHX = headX + 2.2;
              bHY = headY + 3.8;
              fHX = shoulderX + 7.5;
              fHY = shoulderY + 3.5 + liftY * 0.7;
            } else if (armPose === "bonk") {
              // Era 3: hand clutches bonked forehead
              bHX = headX + 3.5;
              bHY = headY - 1.2;
              fHX = shoulderX + 4;
              fHY = shoulderY + 5.5;
            } else if (armPose === "wrench") {
              // Era 3: right wrench arm reaches straight out to cross bolt
              fHX = shoulderX + 8.5;
              fHY = -15;
              bHX = shoulderX - 2.5;
              bHY = shoulderY + 6.5;
            } else if (armPose === "press") {
              // Era 4: right hand reaches out to click checkpoint button
              fHX = shoulderX + 8.2;
              fHY = -17.5;
              bHX = shoulderX - 2;
              bHY = shoulderY + 7;
            } else if (armPose === "dock") {
              // Era 5 Suit-Up Stance: arms held heroically outward while modules converge!
              fHX = shoulderX + 5.4;
              fHY = shoulderY + armLen - 0.8;
              bHX = shoulderX - 5.4;
              bHY = shoulderY + armLen - 0.8;
            } else if (armPose === "launch") {
              // Era 5 Iron Man Takeoff: arms spread cleanly outward, palms angled straight down!
              fHX = shoulderX + 7.4;
              fHY = shoulderY + armLen - 0.8;
              bHX = shoulderX - 7.4;
              bHY = shoulderY + armLen - 0.8;
            }

            frontArm.setAttribute("d", `M ${shoulderX.toFixed(1)},${(shoulderY + 1.5).toFixed(1)} Q ${((shoulderX + fHX) * 0.5 - 0.8).toFixed(1)},${((shoulderY + fHY) * 0.5 + 1.2).toFixed(1)} ${fHX.toFixed(1)},${fHY.toFixed(1)}`);
            backArm.setAttribute("opacity", armPose === "cot" || armPose === "bonk" || armPose === "dock" || armPose === "launch" ? "0.95" : "0.55");
            backArm.setAttribute("d", `M ${shoulderX.toFixed(1)},${(shoulderY + 1.5).toFixed(1)} Q ${((shoulderX + bHX) * 0.5 - 1).toFixed(1)},${((shoulderY + bHY) * 0.5 + 1.2).toFixed(1)} ${bHX.toFixed(1)},${bHY.toFixed(1)}`);

            // Stage 5 Repulsor Gauntlets track wrists
            gauntletF.setAttribute("opacity", hasGauntlets ? "1" : "0");
            gauntletB.setAttribute("opacity", hasGauntlets ? (armPose === "dock" || armPose === "launch" ? "0.95" : "0.65") : "0");
            if (hasGauntlets) {
              gauntletF.setAttribute("transform", `translate(${fHX.toFixed(1)}, ${fHY.toFixed(1)})`);
              gauntletB.setAttribute("transform", `translate(${bHX.toFixed(1)}, ${bHY.toFixed(1)})`);
            }

            // Era 1 C-pincer claw
            const pincerW = 1 - smooth(0.65, 0.95, evo);
            pincerEl.setAttribute("opacity", pincerW.toFixed(2));
            if (pincerW > 0.02) {
              const gap = 2.0 - pincerSnap * 1.45;
              pincerEl.setAttribute("d", `M ${fHX.toFixed(1)},${fHY.toFixed(1)} l 2.6,${(-gap).toFixed(1)} l 1.6,0 M ${fHX.toFixed(1)},${fHY.toFixed(1)} l 2.6,${gap.toFixed(1)} l 1.6,0`);
            }

            // Era 3-4 Precision square-jaw wrench on right forearm
            wrenchEl.setAttribute("opacity", wrenchW.toFixed(2));
            if (wrenchW > 0.02) {
              wrenchEl.setAttribute("d", `M ${fHX.toFixed(1)},${(fHY - 2.1).toFixed(1)} l 3.0,0 M ${fHX.toFixed(1)},${(fHY + 2.1).toFixed(1)} l 3.0,0 M ${fHX.toFixed(1)},${(fHY - 2.1).toFixed(1)} l 0,4.2`);
            }

            // Era 5 Iron Man dual-layer downward palm repulsor jets + jetpack + boot thrusters
            if (jetPower > 0.02) {
              const flick = 0.86 + 0.28 * Math.abs(Math.sin(now * 0.05));
              const jLen = (6.0 + jetPower * 10.5) * flick;
              const jW = 1.7 + jetPower * 0.7;
              const cLen = jLen * 0.58;
              const cW = jW * 0.48;
              repulsorJets.setAttribute("opacity", clamp01(jetPower * 1.25).toFixed(2));
              rightPalmJet.setAttribute("d", `M ${(fHX - jW).toFixed(1)},${(fHY + 1.0).toFixed(1)} L ${(fHX + jW).toFixed(1)},${(fHY + 1.0).toFixed(1)} L ${(fHX + 0.5).toFixed(1)},${(fHY + jLen).toFixed(1)} Z`);
              rightPalmCore.setAttribute("d", `M ${(fHX - cW).toFixed(1)},${(fHY + 1.0).toFixed(1)} L ${(fHX + cW).toFixed(1)},${(fHY + 1.0).toFixed(1)} L ${(fHX + 0.2).toFixed(1)},${(fHY + cLen).toFixed(1)} Z`);
              leftPalmJet.setAttribute("d", `M ${(bHX - jW).toFixed(1)},${(bHY + 1.0).toFixed(1)} L ${(bHX + jW).toFixed(1)},${(bHY + 1.0).toFixed(1)} L ${(bHX - 0.5).toFixed(1)},${(bHY + jLen).toFixed(1)} Z`);
              leftPalmCore.setAttribute("d", `M ${(bHX - cW).toFixed(1)},${(bHY + 1.0).toFixed(1)} L ${(bHX + cW).toFixed(1)},${(bHY + 1.0).toFixed(1)} L ${(bHX - 0.2).toFixed(1)},${(bHY + cLen).toFixed(1)} Z`);
              const pX = -6.2;
              const pY = hipY + 0.8;
              const pLen = (5.0 + jetPower * 12.5) * flick;
              packJet.setAttribute("d", `M ${(pX - 1.9).toFixed(1)},${pY.toFixed(1)} L ${(pX + 1.9).toFixed(1)},${pY.toFixed(1)} L ${pX.toFixed(1)},${(pY + pLen).toFixed(1)} Z`);
              const bLen = (3.0 + jetPower * 6.5) * flick;
              const fy1 = f1.y - totalLift + 0.4;
              const fy2 = f2.y - totalLift + 0.4;
              bootJetF.setAttribute("d", `M ${(f1.x - 1.1).toFixed(1)},${fy1.toFixed(1)} L ${(f1.x + 1.4).toFixed(1)},${fy1.toFixed(1)} L ${(f1.x + 0.1).toFixed(1)},${(fy1 + bLen).toFixed(1)} Z`);
              bootJetB.setAttribute("d", `M ${(f2.x - 1.0).toFixed(1)},${fy2.toFixed(1)} L ${(f2.x + 1.2).toFixed(1)},${fy2.toFixed(1)} L ${(f2.x + 0.1).toFixed(1)},${(fy2 + bLen * 0.85).toFixed(1)} Z`);
            } else {
              repulsorJets.setAttribute("opacity", "0");
            }

            // Era 1 Mode B ink skid-dashes behind sliding robot
            skidCooldown -= dt;
            if (isSliding && skidCooldown <= 0) {
              const s = skidPool[skidIdx % skidPool.length];
              skidIdx += 1;
              s.x = drawX - 9;
              s.yOff = (skidIdx % 2 === 0 ? -1.4 : -3.0);
              s.life = 0.42;
              skidCooldown = 0.11;
            }
            skidPool.forEach((s) => {
              if (s.life > 0) {
                s.life = Math.max(0, s.life - dt);
                const y = (BASE_Y + s.yOff).toFixed(1);
                const len = 4.5 + (1 - s.life / 0.42) * 3.5;
                s.el.setAttribute("x1", (s.x - len).toFixed(1));
                s.el.setAttribute("x2", s.x.toFixed(1));
                s.el.setAttribute("y1", y);
                s.el.setAttribute("y2", y);
                s.el.setAttribute("opacity", ((s.life / 0.42) * 0.36).toFixed(2));
              } else {
                s.el.setAttribute("opacity", "0");
              }
            });

            // Era 5 Evenly-spaced Tracing micro-dots behind engineer
            traceCooldown -= dt;
            if (isEquipped && moveSpeed > 10 && traceCooldown <= 0 && edgeFade > 0.4) {
              const p = tracePool[traceIdx % tracePool.length];
              traceIdx += 1;
              p.x = drawX - 5;
              p.life = 1.0;
              traceCooldown = 0.26;
            }
            tracePool.forEach((p) => {
              if (p.life > 0) {
                p.life = Math.max(0, p.life - dt);
                p.el.setAttribute("cx", p.x.toFixed(1));
                p.el.setAttribute("opacity", (p.life * 0.48).toFixed(2));
              } else {
                p.el.setAttribute("opacity", "0");
              }
            });

            // Click celebration spark
            clickSpark.setAttribute("opacity", clickHopTimer > 0.12 ? ((clickHopTimer - 0.12) / 0.38).toFixed(2) : "0");
          }

          requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
      }

      /* =======================================================================
         11. TOP-RIGHT LIVE MECH HEAD AVATAR

      function initTopRightMechAvatar() {

        mk("path", { d: "M -4.8,10.5 L -1.8,10.5 L -1.2,13.5 L -5.0,13.5 Z", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "1.0", "stroke-linejoin": "round" }, legsG);
        mk("path", { d: "M 1.4,11.5 L 4.4,11.5 L 5.2,14.8 L 1.2,14.8 Z", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "1.05", "stroke-linejoin": "round" }, legsG);

        mk("path", { d: "M -5.4,-3.8 L 5.4,-3.8 L 6.2,-1.6 L -6.2,-1.6 Z", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "1.1", "stroke-linejoin": "round" }, torsoG);
        mk("rect", { x: "-4.6", y: "-3.2", width: "9.2", height: "9.4", rx: "1.1", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "1.25" }, torsoG);
        mk("path", { d: "M -3.8,-2.4 L 3.8,5.4 M 3.8,-2.4 L -3.8,5.4", fill: "none", stroke: "#1D1B18", "stroke-width": "0.95", "stroke-linecap": "round" }, torsoG);

        const jetR = mk("path", { fill: "#2D6A47", "fill-opacity": "0.28", stroke: "#1D1B18", "stroke-width": "0.95", "stroke-linejoin": "round" }, jetsG);
        const jetB = mk("path", { fill: "#2D6A47", "fill-opacity": "0.32", stroke: "#2D6A47", "stroke-width": "0.85" }, jetsG);

        // --- Hero Mech Head Group (morphs, scans whole page, glides to top-left!) ---
        const headG = mk("g", { transform: "translate(0, -8.8) scale(1)" }, rootG);
        mk("line", { x1: "-0.8", y1: "-4.6", x2: "-1.4", y2: "-8.4", stroke: "#1D1B18", "stroke-width": "1.15", "stroke-linecap": "round" }, headG);
        mk("circle", { class: "mech-ant-tip", cx: "-1.5", cy: "-9.1", r: "1.35", fill: "#2D6A47", stroke: "#1D1B18", "stroke-width": "0.95" }, headG);
        mk("rect", { x: "-6.9", y: "-1.6", width: "1.6", height: "3.4", rx: "0.6", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "0.95" }, headG);
        mk("rect", { x: "5.3", y: "-1.6", width: "1.6", height: "3.4", rx: "0.6", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "0.95" }, headG);
        mk("path", { d: "M -4.6,-4.4 L 0,-7.0 L 4.6,-4.4", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "1.05", "stroke-linecap": "round", "stroke-linejoin": "round" }, headG);
        mk("rect", { x: "-5.8", y: "-4.6", width: "11.6", height: "9.0", rx: "2.5", fill: "#FAF8F4", stroke: "#1D1B18", "stroke-width": "1.2" }, headG);
        mk("rect", { x: "-4.3", y: "-2.7", width: "8.6", height: "5.2", rx: "1.7", fill: "#1D1B18" }, headG);
        const eyesIdleG = mk("g", { class: "mech-eyes-idle" }, headG);
        const eyesTrackG = mk("g", null, eyesIdleG);
        const eyeDotL = mk("circle", { cx: "-1.8", cy: "-0.1", r: "1.25", fill: "#FAF8F4" }, eyesTrackG);
        const eyeDotR = mk("circle", { cx: "1.8", cy: "-0.1", r: "1.25", fill: "#FAF8F4" }, eyesTrackG);
        const eyesHappyG = mk("g", { class: "mech-eyes-happy" }, headG);
        mk("path", { d: "M -3.1,0.5 Q -1.8,-1.3 -0.5,0.5 M 0.5,0.5 Q 1.8,-1.3 3.1,0.5", fill: "none", stroke: "#B5F5D4", "stroke-width": "1.05", "stroke-linecap": "round" }, eyesHappyG);

        let avPhase = "waiting"; // "waiting" | "delay" | "descending" | "morphing" | "scanning" | "gliding" | "avatar"
        let avT = 0;
        let syncTimer = 0;
        let glideStartX = 0;
        let lastTs = performance.now();
        const eyePos = { tx: 0, ty: 0, cx: 0, cy: 0 };

        function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
        function lerp(a, b, t) { return a + (b - a) * t; }

        function getRightOffsetX() {
          const navRect = topNav.getBoundingClientRect();
          const style = getComputedStyle(topNav);
          const padL = parseFloat(style.paddingLeft) || 24;
          const padR = parseFloat(style.paddingRight) || 24;
          return Math.max(0, navRect.width - padL - padR - 44);
        }

        function hideScanBeams() {
          if (!scanConeL) return;
          scanConeL.setAttribute("opacity", "0");
          scanConeR.setAttribute("opacity", "0");
          scanRay1.setAttribute("opacity", "0");
          scanRay2.setAttribute("opacity", "0");
          scanBand.setAttribute("opacity", "0");
        }

        function triggerBlink(doubleBlink) {
          btn.classList.add("is-blinking");
          setTimeout(() => {
            btn.classList.remove("is-blinking");
            if (doubleBlink) setTimeout(() => triggerBlink(false), 140);
          }, 120);
        }

        function scheduleBlink() {
          setTimeout(() => {
            if (avPhase === "avatar") triggerBlink(Math.random() < 0.25);
            scheduleBlink();
          }, 2900 + Math.random() * 3200);
        }
        scheduleBlink();

        window.addEventListener("mousemove", (e) => {
          if (avPhase !== "avatar") return;
          const r = btn.getBoundingClientRect();
          const dx = e.clientX - (r.left + r.width / 2);
          const dy = e.clientY - (r.top + r.height / 2);
          const dist = Math.hypot(dx, dy) || 1;
          const ratio = Math.min(1, dist / 240);
          eyePos.tx = (dx / dist) * 1.35 * ratio;
          eyePos.ty = (dy / dist) * 0.95 * ratio;
        }, { passive: true });

        document.addEventListener("mouseleave", () => {
          eyePos.tx = 0;
          eyePos.ty = 0;
        });

        btn.addEventListener("click", () => {
          if (avPhase !== "avatar") return;
          btn.classList.remove("is-nodding");
          void btn.offsetWidth;
          btn.classList.add("is-nodding");
          triggerBlink(false);
          if (state.view !== "home") switchView("home");
        });

        window.__onMechExitedTop = () => {
          if (avPhase === "waiting") {
            avPhase = "delay";
            avT = 0;
          } else if (avPhase === "avatar") {
            syncTimer = 0.48;
            btn.classList.remove("is-nodding");
            void btn.offsetWidth;
            btn.classList.add("is-nodding");
            triggerBlink(true);
          }
        };

        function tickAvatar(now) {
          const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
          lastTs = now;

          if (avPhase === "delay") {
            avT += dt;
            if (avT >= 0.22) {
              avPhase = "descending";
              avT = 0;
              glideStartX = getRightOffsetX();
              btn.style.transform = `translateX(${glideStartX.toFixed(1)}px)`;
              btn.classList.add("is-visible");
            }
          } else if (avPhase === "descending") {
            avT += dt;
            const u = clamp01(avT / 0.86);
            const easeOut = 1 - Math.pow(1 - u, 3);
            const y = lerp(-62, 1, easeOut);
            rootG.setAttribute("transform", `translate(0, ${y.toFixed(2)})`);
            headG.setAttribute("transform", "translate(0, -8.8) scale(1)");
            legsG.setAttribute("opacity", "1");
            armsG.setAttribute("opacity", "1");
            torsoG.setAttribute("opacity", "1");
            legsG.removeAttribute("transform");
            armsG.removeAttribute("transform");
            torsoG.removeAttribute("transform");

            const brakePower = Math.sin(u * Math.PI) * (1 - u * 0.25);
            if (brakePower > 0.04) {
              const flick = 0.85 + 0.3 * Math.abs(Math.sin(now * 0.055));
              const jLen = (4 + brakePower * 9) * flick;
              jetsG.setAttribute("opacity", clamp01(brakePower * 1.4).toFixed(2));
              jetL.setAttribute("d", `M -12.0,6.8 L -8.8,6.8 L -10.4,${(6.8 + jLen).toFixed(1)} Z`);
              jetR.setAttribute("d", `M 8.8,6.8 L 12.0,6.8 L 10.4,${(6.8 + jLen).toFixed(1)} Z`);
              jetB.setAttribute("d", `M -2.2,13.8 L 3.8,13.8 L 0.8,${(13.8 + jLen * 0.85).toFixed(1)} Z`);
            } else {
              jetsG.setAttribute("opacity", "0");
            }

            if (u > 0.55) {
              const bu = (u - 0.55) / 0.45;
              brakeRing.setAttribute("rx", (6 + bu * 14).toFixed(1));
              brakeRing.setAttribute("ry", (1.4 + bu * 2.2).toFixed(1));
              brakeRing.setAttribute("opacity", ((1 - bu) * 0.55).toFixed(2));
            } else {
              brakeRing.setAttribute("opacity", "0");
            }

            if (avT >= 0.86) {
              avPhase = "morphing";
              avT = 0;
              jetsG.setAttribute("opacity", "0");
              brakeRing.setAttribute("opacity", "0");
            }
          } else if (avPhase === "morphing") {
            avT += dt;
            const u = clamp01(avT / 0.72);
            rootG.setAttribute("transform", "translate(0, 0)");

            const foldU = clamp01(u / 0.58);
            const foldEase = foldU * foldU * (3 - 2 * foldU);
            legsG.setAttribute("transform", `translate(0, ${(-13 * foldEase).toFixed(1)}) scale(${(1 - 0.35 * foldEase).toFixed(2)}, ${(1 - 0.88 * foldEase).toFixed(2)})`);
            legsG.setAttribute("opacity", (1 - foldEase).toFixed(2));
            armsG.setAttribute("transform", `translate(0, ${(-6 * foldEase).toFixed(1)}) scale(${(1 - 0.85 * foldEase).toFixed(2)}, ${(1 - 0.4 * foldEase).toFixed(2)})`);
            armsG.setAttribute("opacity", (1 - foldEase).toFixed(2));
            const torsoU = clamp01((u - 0.12) / 0.50);
            const torsoEase = torsoU * torsoU * (3 - 2 * torsoU);
            torsoG.setAttribute("transform", `translate(0, ${(-9 * torsoEase).toFixed(1)}) scale(${(1 - 0.35 * torsoEase).toFixed(2)}, ${(1 - 0.9 * torsoEase).toFixed(2)})`);
            torsoG.setAttribute("opacity", (1 - torsoEase).toFixed(2));

            const headU = clamp01((u - 0.24) / 0.76);
            const overshoot = headU < 0.78
              ? lerp(1.0, 1.98, 1 - Math.pow(1 - headU / 0.78, 3))
              : lerp(1.98, 1.86, (headU - 0.78) / 0.22);
            const headY = lerp(-8.8, 3.2, 1 - Math.pow(1 - headU, 3));
            headG.setAttribute("transform", `translate(0, ${headY.toFixed(2)}) scale(${overshoot.toFixed(3)})`);

            if (u >= 0.72) {
              const su = (u - 0.72) / 0.28;
              morphSparks.setAttribute("opacity", ((1 - su) * 0.9).toFixed(2));
              morphRing.setAttribute("r", (9 + su * 11).toFixed(1));
              morphRing.setAttribute("opacity", ((1 - su) * 0.65).toFixed(2));
            }

            if (avT >= 0.72) {
              avPhase = "scanning";
              avT = 0;
              legsG.setAttribute("opacity", "0");
              armsG.setAttribute("opacity", "0");
              torsoG.setAttribute("opacity", "0");
              morphSparks.setAttribute("opacity", "0");
              morphRing.setAttribute("opacity", "0");
              headG.setAttribute("transform", "translate(0, 3.2) scale(1.86)");
            }
          } else if (avPhase === "scanning") {
            // Twin eyes glow bamboo-cyan & sweep scanner cones across the entire webpage (right -> left)
            avT += dt;
            const u = clamp01(avT / 1.12);
            const beamAlpha = u < 0.12 ? u / 0.12 : u > 0.86 ? (1 - u) / 0.14 : 1;
            const sweepU = clamp01((u - 0.10) / 0.78);
            const sweepEase = sweepU < 0.5 ? 2 * sweepU * sweepU : 1 - Math.pow(-2 * sweepU + 2, 2) / 2;

            // Eyes glow bright scanning cyan-green & track the sweep across the page
            eyeDotL.setAttribute("fill", "#9CEBE6");
            eyeDotR.setAttribute("fill", "#9CEBE6");
            const lookX = lerp(0.8, -1.35, sweepEase);
            const lookY = lerp(0.85, 0.35, sweepEase);
            eyesTrackG.setAttribute("transform", `translate(${lookX.toFixed(2)}, ${lookY.toFixed(2)})`);

            if (scanConeL) {
              const r = btn.getBoundingClientRect();
              const ex1 = r.left + r.width * 0.43;
              const ex2 = r.left + r.width * 0.57;
              const ey = r.top + r.height * 0.57;
              const W = window.innerWidth;
              const H = window.innerHeight;

              // Leading & trailing edge of the sweeping full-page scan cone
              const leadX = lerp(W * 0.98, -W * 0.04, sweepEase);
              const trailX = Math.min(W, leadX + Math.max(150, W * 0.15));
              const targetY = lerp(H, H * 0.72, Math.pow(sweepEase, 2));

              scanConeL.setAttribute("points", `${ex1.toFixed(1)},${ey.toFixed(1)} ${leadX.toFixed(1)},${targetY.toFixed(1)} ${trailX.toFixed(1)},${H}`);
              scanConeR.setAttribute("points", `${ex2.toFixed(1)},${ey.toFixed(1)} ${(leadX + 24).toFixed(1)},${targetY.toFixed(1)} ${Math.min(W, trailX + 24).toFixed(1)},${H}`);
              scanConeL.setAttribute("opacity", (beamAlpha * 0.85).toFixed(2));
              scanConeR.setAttribute("opacity", (beamAlpha * 0.55).toFixed(2));

              scanRay1.setAttribute("x1", ex1.toFixed(1));
              scanRay1.setAttribute("y1", ey.toFixed(1));
              scanRay1.setAttribute("x2", leadX.toFixed(1));
              scanRay1.setAttribute("y2", targetY.toFixed(1));
              scanRay1.setAttribute("opacity", (beamAlpha * 0.75).toFixed(2));

              scanRay2.setAttribute("x1", ex2.toFixed(1));
              scanRay2.setAttribute("y1", ey.toFixed(1));
              scanRay2.setAttribute("x2", trailX.toFixed(1));
              scanRay2.setAttribute("y2", String(H));
              scanRay2.setAttribute("opacity", (beamAlpha * 0.45).toFixed(2));

              scanBand.setAttribute("x1", leadX.toFixed(1));
              scanBand.setAttribute("y1", "46");
              scanBand.setAttribute("x2", leadX.toFixed(1));
              scanBand.setAttribute("y2", String(H));
              scanBand.setAttribute("opacity", (beamAlpha * 0.35).toFixed(2));
            }

            if (avT >= 1.12) {
              avPhase = "gliding";
              avT = 0;
              glideStartX = getRightOffsetX();
              hideScanBeams();
              eyeDotL.setAttribute("fill", "#FAF8F4");
              eyeDotR.setAttribute("fill", "#FAF8F4");
              triggerBlink(false);
            }
          } else if (avPhase === "gliding") {
            // Glide smoothly from top-right to top-left while gradually revealing the nav links at top-right!
            avT += dt;
            const u = clamp01(avT / 0.96);
            const ease = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
            const curX = lerp(glideStartX, 0, ease);
            btn.style.transform = `translateX(${curX.toFixed(1)}px)`;

            // Subtle forward-left aerodynamic tilt + eyes looking left + delicate glide trail
            const tilt = -Math.sin(u * Math.PI) * 6.5;
            headG.setAttribute("transform", `translate(0, 3.2) scale(1.86) rotate(${tilt.toFixed(1)})`);
            eyesTrackG.setAttribute("transform", `translate(${(-1.25 * Math.sin(u * Math.PI)).toFixed(2)}, 0)`);
            glideTrail.setAttribute("opacity", (Math.sin(u * Math.PI) * 0.55).toFixed(2));

            // Gradually reveal nav links right-to-left (关于 -> 全部文章 -> 图谱首页) behind the gliding head!
            const revCount = navBtns.length;
            for (let i = 0; i < revCount; i++) {
              const revIdx = revCount - 1 - i; // 0 = 关于 (rightmost), 1 = 全部文章, 2 = 图谱首页
              const startU = 0.14 + revIdx * 0.16;
              const btnU = clamp01((u - startU) / 0.38);
              const btnEase = 1 - Math.pow(1 - btnU, 3);
              navBtns[i].style.opacity = btnEase.toFixed(2);
              navBtns[i].style.transform = `translateX(${lerp(8, 0, btnEase).toFixed(1)}px)`;
            }

            if (avT >= 0.96) {
              avPhase = "avatar";
              btn.style.transform = "";
              headG.setAttribute("transform", "translate(0, 3.2) scale(1.86)");
              eyesTrackG.setAttribute("transform", "translate(0, 0)");
              glideTrail.setAttribute("opacity", "0");
              navBtns.forEach((nb) => {
                nb.style.opacity = "1";
                nb.style.transform = "translateX(0)";
              });
              navLinksEl.classList.add("is-revealed");
              btn.classList.add("is-docked");
              syncTimer = 0.42;
              triggerBlink(false);
            }
          } else if (avPhase === "avatar") {
            eyePos.cx += (eyePos.tx - eyePos.cx) * 0.16;
            eyePos.cy += (eyePos.ty - eyePos.cy) * 0.16;
            eyesTrackG.setAttribute("transform", `translate(${eyePos.cx.toFixed(2)}, ${eyePos.cy.toFixed(2)})`);

            if (syncTimer > 0) {
              syncTimer = Math.max(0, syncTimer - dt);
              const su = 1 - syncTimer / 0.48;
              morphRing.setAttribute("r", (10 + su * 10).toFixed(1));
              morphRing.setAttribute("opacity", ((1 - su) * 0.55).toFixed(2));
            } else {
              morphRing.setAttribute("opacity", "0");
            }
          }

          requestAnimationFrame(tickAvatar);
        }

        requestAnimationFrame(tickAvatar);
      }

      initTopRightMechAvatar();
      initEvoWalker();

      renderAll();
    })();
  </script>
</body>
</html>
