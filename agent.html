<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 演进手札 · 以时间轴为骨，以长文为血肉</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================================
       1. DESIGN SYSTEM — 「02 · 细枝目录卷」
       Warm Rice-Paper · Architectural Hairlines · Vermilion Seal · Bamboo Green
       ========================================================================= */
    :root {
      --paper: #FAF8F4;
      --stone-surface: #F3EFE7;
      --bamboo-wash: #E6EFE8;

      --ink-primary: #1D1B18;
      --ink-secondary: #5E584F;
      --ink-muted: #968E82;
      --ink-planned: #ACA498;
      --ink-hollow: #C9C2B6;

      --hairline: rgba(29, 27, 24, 0.10);
      --hairline-mid: rgba(29, 27, 24, 0.17);
      --hairline-strong: rgba(29, 27, 24, 0.28);

      /* Accent: Vermilion Seal Red */
      --vermilion: #B83B2A;
      --vermilion-ring: rgba(184, 59, 42, 0.26);

      /* Accent: Pure Publish Bamboo Green Scale (0 / 1 / 2 / 3+ posts) */
      --bamboo-0: #EBE7DF;
      --bamboo-1: #6FA882;
      --bamboo-2: #3F8457;
      --bamboo-3: #235737;
      --bamboo-4: #2D6A47;
      --bamboo-ring: rgba(45, 106, 71, 0.28);

      /* GitHub Heatmap Cell Geometry (strict 1:1 square) */
      --cell-size: 10px;
      --cell-gap: 3px;

      /* Typography */
      --font-serif: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      --font-sans: "Inter", "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      /* Fluid Vertical Budget Tokens (strictly tuned for 1280x700 – 1440x900) */
      --nav-h: clamp(42px, 5.6vh, 48px);
      --era-foot-h: clamp(46px, 6.2vh, 52px);
      --era-runway-pb: 46px;
      --dock-h: clamp(124px, 16.5vh, 136px);
      --colophon-h: 0px;
      --page-px: clamp(18px, 2.4vw, 32px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--paper);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* HARD ZERO-SCROLL LOCK ON HOMEPAGE */
    body.view-home {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .site-shell {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--paper);
      position: relative;
    }

    body.view-home .site-shell {
      width: 100vw;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    /* =========================================================================
       2. BAND 1: MINIMAL TOP NAVIGATION BAR (~48px)
       ========================================================================= */
    .top-nav {
      flex: 0 0 var(--nav-h);
      height: var(--nav-h);
      padding: 0 var(--page-px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--hairline);
      background-color: var(--paper);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand-cluster {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    /* Top-Right Live Mech Head Avatar (descends & morphs after Stage 5 takeoff!) */
    .mech-avatar-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 44px;
      height: 36px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      overflow: visible;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s var(--ease-out);
    }

    .mech-avatar-btn.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .mech-avatar-btn.is-docked:hover {
      transform: scale(1.08) translateY(-1px);
    }

    .mech-avatar-btn.is-nodding {
      animation: mechNod 0.36s var(--ease-out);
    }

    @keyframes mechNod {
      0%   { transform: scale(1) translateY(0); }
      45%  { transform: scale(1.04) translateY(2.5px); }
      100% { transform: scale(1) translateY(0); }
    }

    .mech-avatar-btn svg {
      width: 44px;
      height: 36px;
      overflow: visible;
      display: block;
    }

    .mech-ant-tip {
      animation: mechLedPulse 3.2s ease-in-out infinite;
    }

    @keyframes mechLedPulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    .mech-eyes-idle {
      transform-box: fill-box;
      transform-origin: center center;
      transition: transform 0.09s ease-in-out, opacity 0.14s ease;
    }

    .mech-avatar-btn.is-blinking .mech-eyes-idle {
      transform: scaleY(0.1);
    }

    .mech-eyes-happy {
      opacity: 0;
      transition: opacity 0.14s ease;
    }

    .mech-avatar-btn.is-docked:hover .mech-eyes-idle {
      opacity: 0;
    }

    .mech-avatar-btn.is-docked:hover .mech-eyes-happy {
      opacity: 1;
    }

    .brand-sub {
      font-size: clamp(11px, 0.9vw, 12px);
      color: var(--ink-muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-links {
      display: flex;
      align-items: stretch;
      height: 100%;
      gap: clamp(16px, 2vw, 26px);
      flex-shrink: 0;
      pointer-events: none;
    }

    .nav-links.is-revealed {
      pointer-events: auto;
    }

    .nav-btn {
      position: relative;
      appearance: none;
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 400;
      color: var(--ink-secondary);
      cursor: pointer;
      padding: 0 2px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateX(8px);
      transition: color 0.16s ease;
    }

    .mech-scan-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 35;
      overflow: visible;
    }

    .nav-btn:hover {
      color: var(--ink-primary);
    }

    .nav-btn.is-active {
      color: var(--ink-primary);
      font-weight: 500;
    }

    .nav-btn.is-active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1.5px;
      background-color: var(--ink-primary);
    }

    /* View Containers */
    .view-panel {
      display: none;
    }

    .view-panel.is-visible {
      display: flex;
    }

    /* =========================================================================
       3. HOMEPAGE CONTAINER (ZERO SCROLL, EXACT 100vh - nav-h)
       ========================================================================= */
    .home-view {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      flex-direction: column;
      overflow: visible;
    }

    /* -------------------------------------------------------------------------
       BAND 2: MAIN SKELETON STAGE — 「02 · 细枝目录卷」
       Strictly 5 equal columns with subtle local scroll fallback
       ------------------------------------------------------------------------- */
    .skeleton-stage {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      padding: clamp(4px, 0.7vh, 8px) var(--page-px) clamp(4px, 0.8vh, 8px);
      display: flex;
      flex-direction: column;
      overflow: visible;
      position: relative;
    }

    .skeleton-grid {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      position: relative;
      overflow: hidden;
    }

    /* Evolving Ink-Art Robot Runway seated flush atop .timeline-spine */
    .evo-walker-layer {
      position: absolute;
      left: var(--page-px);
      right: var(--page-px);
      bottom: calc(clamp(4px, 0.8vh, 8px) + var(--era-foot-h) - 2px);
      height: 44px;
      pointer-events: none;
      z-index: 40;
      overflow: visible;
    }

    .evo-walker-layer svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .evo-bot-hit {
      pointer-events: auto;
      cursor: pointer;
    }

    /* Continuous Horizontal Timeline Spine running seamlessly across all 5 columns */
    .timeline-spine {
      position: absolute;
      left: 0;
      right: 1px;
      bottom: var(--era-foot-h);
      height: 1.5px;
      background-color: rgba(29, 27, 24, 0.36);
      pointer-events: none;
      z-index: 2;
    }

    .timeline-spine::after {
      content: "";
      position: absolute;
      right: 0;
      top: -2.75px;
      width: 7px;
      height: 7px;
      border-top: 1.5px solid rgba(29, 27, 24, 0.44);
      border-right: 1.5px solid rgba(29, 27, 24, 0.44);
      transform: rotate(45deg);
    }

    .era-col {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) var(--era-foot-h);
      border-left: 1px solid var(--hairline);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      transition: background-color 0.22s ease;
    }

    .era-col:first-of-type {
      border-left: none;
    }

    .era-col.is-linked-era {
      background-color: rgba(230, 239, 232, 0.42);
    }

    /* Warm rice-paper fade mask right above the robot runway when a column overflows vertically */
    .era-scroll-mask {
      position: absolute;
      left: 1px;
      right: 0;
      bottom: calc(var(--era-foot-h) + var(--era-runway-pb) - 6px);
      height: 22px;
      background: linear-gradient(to bottom, rgba(250, 248, 244, 0) 0%, var(--paper) 92%);
      pointer-events: none;
      opacity: 0;
      z-index: 5;
      transition: opacity 0.2s ease;
    }

    .era-col.has-scroll-more .era-scroll-mask {
      opacity: 1;
    }

    /* Spine Milestone Dot aligned directly on each column's left vertical stem */
    .spine-dot {
      position: absolute;
      bottom: var(--era-foot-h);
      left: 20.5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--paper);
      border: 1.5px solid var(--ink-hollow);
      transform: translate(-50%, 50%);
      z-index: 4;
      transition: all 0.24s var(--ease-out);
    }

    .era-col:first-of-type .spine-dot {
      left: 8.5px;
    }

    .spine-dot.is-lit-bamboo {
      background-color: var(--bamboo-4);
      border-color: var(--bamboo-4);
      box-shadow: 0 0 0 3px rgba(45, 106, 71, 0.12);
    }

    .spine-dot.is-lit-vermilion {
      background-color: var(--vermilion);
      border-color: var(--vermilion);
      box-shadow: 0 0 0 3.5px rgba(184, 59, 42, 0.16);
    }

    /* Footer Zone (below Timeline Spine): Era Title + Era Year + Concise Whisper */
    .era-upper {
      padding: 10px clamp(10px, 1.1vw, 16px) 2px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 0;
      overflow: hidden;
    }

    .era-col:first-of-type .era-upper {
      padding-left: 8px;
    }

    .era-title-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      min-width: 0;
    }

    .era-title {
      flex: 0 1 auto;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: clamp(13px, 1.12vw, 15px);
      font-weight: 600;
      color: var(--ink-primary);
      letter-spacing: 0.02em;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .era-year {
      font-family: var(--font-mono);
      font-size: clamp(9.5px, 0.76vw, 10.5px);
      color: var(--ink-muted);
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.01em;
    }

    .era-whisper {
      margin-top: 2px;
      font-size: clamp(10px, 0.8vw, 11.2px);
      color: var(--ink-secondary);
      opacity: 0.82;
      line-height: 1.28;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Upper Catalog Zone (rising upward from Timeline Spine, bottom-aligned above robot runway) */
    .era-lower {
      padding: 10px clamp(6px, 0.75vw, 12px) var(--era-runway-pb) 20px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }

    .era-lower::-webkit-scrollbar {
      display: none;
    }

    .era-col:first-of-type .era-lower {
      padding-left: 8px;
    }

    .twig-list {
      list-style: none;
      flex: 0 0 auto;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      min-width: 0;
    }

    /* Compact catalog rhythm: fixed 3.5px vertical padding */
    .twig-item {
      position: relative;
      flex: 0 0 auto;
      padding: 3.5px 0 3.5px 14px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Vertical 1px stem segment rising upward from bottom spine-dot */
    .twig-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: var(--hairline-mid);
      pointer-events: none;
      transition: background-color 0.25s ease;
    }

    /* Terminate top twig stem cleanly at the horizontal arm of the topmost row */
    .twig-item:first-child::before {
      top: 15px;
    }

    /* Connect bottom twig stem down through the runway flush to the top edge of the 8px spine-dot */
    .twig-item:last-child::before {
      bottom: calc(-1 * var(--era-runway-pb) + 4px);
    }

    .twig-item:first-child:last-child::before {
      top: 15px;
      bottom: calc(-1 * var(--era-runway-pb) + 4px);
    }

    /* Lit trunk path from spine-dot down to the furthest published twig in column */
    .twig-item.is-stem-bamboo::before {
      background-color: rgba(45, 106, 71, 0.38);
    }

    .twig-item.is-stem-vermilion::before {
      background-color: rgba(184, 59, 42, 0.38);
    }

    /* Stop lit trunk color at the horizontal arm junction when planned twigs continue below */
    .twig-item.is-stem-bamboo.is-stem-end:not(:last-child)::before {
      background: linear-gradient(
        to bottom,
        rgba(45, 106, 71, 0.38) 0%,
        rgba(45, 106, 71, 0.38) 15px,
        var(--hairline-mid) 15px,
        var(--hairline-mid) 100%
      );
    }

    .twig-item.is-stem-vermilion.is-stem-end:not(:last-child)::before {
      background: linear-gradient(
        to bottom,
        rgba(184, 59, 42, 0.38) 0%,
        rgba(184, 59, 42, 0.38) 15px,
        var(--hairline-mid) 15px,
        var(--hairline-mid) 100%
      );
    }

    /* Crisp horizontal 1px L-connector branching from stem to the status dot */
    .twig-item::after {
      content: "";
      position: absolute;
      left: 0;
      top: 15px;
      width: 12px;
      height: 1px;
      background-color: var(--hairline-mid);
      pointer-events: none;
      transition: background-color 0.2s ease;
    }

    .twig-item.is-planned::after {
      background-color: rgba(29, 27, 24, 0.11);
    }

    .twig-item.is-published::after {
      background-color: rgba(45, 106, 71, 0.38);
    }

    .twig-item.is-published.is-flagship::after {
      background-color: rgba(184, 59, 42, 0.45);
    }

    .twig-row {
      position: relative;
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      margin-left: -2px;
      border-radius: 4px;
      border: 1px solid transparent;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.2s var(--ease-out);
    }

    /* Non-blocking 1.2s return-afterglow highlight when returning from reader */
    .twig-row.is-just-read {
      animation: justReadGlow 1.2s var(--ease-out) forwards;
    }

    @keyframes justReadGlow {
      0% {
        background-color: rgba(111, 168, 130, 0.26);
        border-color: rgba(45, 106, 71, 0.32);
      }
      35% {
        background-color: rgba(111, 168, 130, 0.18);
        border-color: rgba(45, 106, 71, 0.22);
      }
      100% {
        background-color: transparent;
        border-color: transparent;
      }
    }

    .twig-item.is-published.is-flagship .twig-row.is-just-read {
      animation: justReadGlowFlagship 1.2s var(--ease-out) forwards;
    }

    @keyframes justReadGlowFlagship {
      0% {
        background-color: rgba(184, 59, 42, 0.18);
        border-color: rgba(184, 59, 42, 0.38);
      }
      35% {
        background-color: rgba(184, 59, 42, 0.11);
        border-color: rgba(184, 59, 42, 0.26);
      }
      100% {
        background-color: rgba(184, 59, 42, 0.045);
        border-color: rgba(184, 59, 42, 0.18);
      }
    }

    .twig-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.2s var(--ease-out), box-shadow 0.22s ease, background-color 0.2s ease;
    }

    .twig-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: clamp(11.4px, 0.84vw, 12.2px);
      line-height: 1.32;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.005em;
      transition: color 0.16s ease;
    }

    /* Static right-aligned metadata on published twigs */
    .twig-badge {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 9px;
      line-height: 1;
      padding: 0;
      border-radius: 3px;
      white-space: nowrap;
      color: var(--ink-muted);
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .twig-badge.is-multi {
      padding: 2px 4px;
      color: var(--bamboo-4);
      background-color: rgba(45, 106, 71, 0.10);
      font-weight: 500;
    }

    /* Secondary sub-articles list under multi-post nodes */
    .sub-twig-list {
      list-style: none;
      margin: 2px 0 2px 7px;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 1.5px;
      min-width: 0;
    }

    .twig-item.is-collapsed .sub-twig-list {
      display: none;
    }

    .sub-twig-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 100%;
      padding: 2px 5px 2px 2px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 5px;
      text-align: left;
      min-width: 0;
      color: var(--ink-secondary);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .sub-twig-branch {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: rgba(45, 106, 71, 0.45);
      flex-shrink: 0;
      line-height: 1;
      user-select: none;
    }

    .sub-twig-title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 11.5px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-twig-date {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 8.8px;
      color: var(--ink-muted);
    }

    .sub-twig-btn:hover {
      background-color: var(--bamboo-wash);
      color: var(--bamboo-4);
    }

    .sub-twig-btn.is-flagship-sub:hover {
      background-color: rgba(184, 59, 42, 0.08);
      color: var(--vermilion);
    }

    .sub-twig-btn.is-flagship-sub .sub-twig-branch {
      color: rgba(184, 59, 42, 0.55);
    }

    /* State: Real / Flagship Published — Exclusive Warm Bookmark Anchor */
    .twig-item.is-published.is-flagship .twig-row {
      background-color: rgba(184, 59, 42, 0.045);
      border-color: rgba(184, 59, 42, 0.18);
    }

    .twig-item.is-published.is-flagship .twig-dot {
      background-color: var(--vermilion);
      box-shadow: 0 0 0 2.5px rgba(184, 59, 42, 0.16);
    }

    .twig-item.is-published.is-flagship .twig-title {
      font-weight: 600;
    }

    .twig-item.is-published.is-flagship .twig-badge {
      color: var(--vermilion);
    }

    /* State: Standard Published */
    .twig-item.is-published:not(.is-flagship) .twig-dot {
      background-color: var(--bamboo-4);
    }

    .twig-item.is-published .twig-row {
      cursor: pointer;
    }

    .twig-item.is-published .twig-title {
      color: var(--ink-primary);
      font-weight: 500;
    }

    .twig-item.is-published .twig-row:hover {
      background-color: var(--bamboo-wash);
      border-color: rgba(45, 106, 71, 0.30);
    }

    .twig-item.is-published.is-flagship .twig-row:hover {
      background-color: rgba(184, 59, 42, 0.08);
      border-color: rgba(184, 59, 42, 0.34);
    }

    .twig-item.is-published:hover::after {
      background-color: var(--bamboo-4);
    }

    .twig-item.is-published.is-flagship:hover::after {
      background-color: var(--vermilion);
    }

    .twig-item.is-published:not(.is-flagship) .twig-row:hover .twig-title {
      color: var(--bamboo-4);
    }

    .twig-item.is-published.is-flagship .twig-row:hover .twig-title {
      color: var(--vermilion);
    }

    /* State: Planned (Hollow Circle, Soft Stone Gray) */
    .twig-item.is-planned .twig-row {
      cursor: default;
    }

    .twig-item.is-planned .twig-dot {
      width: 5.5px;
      height: 5.5px;
      margin-left: 0.25px;
      background-color: var(--paper);
      border: 1.2px solid var(--ink-hollow);
    }

    .twig-item.is-planned .twig-title {
      color: #9E968A;
      font-weight: 400;
    }

    .twig-item.is-planned .twig-row:hover {
      background-color: rgba(243, 239, 231, 0.72);
    }

    .twig-item.is-planned .twig-row:hover .twig-title {
      color: var(--ink-secondary);
    }

    /* Bidirectional Hover Link State from Heatmap */
    .twig-item.is-linked-twig .twig-row {
      background-color: var(--bamboo-wash) !important;
      border-color: rgba(45, 106, 71, 0.34) !important;
      transform: translateX(2px);
    }

    .twig-item.is-linked-twig .twig-title {
      color: var(--bamboo-4) !important;
    }

    .twig-item.is-linked-twig .twig-dot {
      transform: scale(1.28);
      box-shadow: 0 0 0 4px var(--bamboo-ring);
    }

    /* -------------------------------------------------------------------------
       BAND 3: BOTTOM DOCK (Auto-wrapped 53-week GitHub Graph + Recent Panel)
       ------------------------------------------------------------------------- */
    .bottom-dock {
      flex: 0 0 var(--dock-h);
      height: var(--dock-h);
      border-bottom: 1px solid var(--hairline);
      padding: 0 var(--page-px);
      display: grid;
      grid-template-columns: auto minmax(280px, 1fr);
      background-color: var(--paper);
      overflow: hidden;
    }

    /* LEFT: Authentic GitHub-Style Publish Contribution Graph */
    .dock-footprint {
      padding: 8px clamp(16px, 2vw, 26px) 7px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .fp-readout {
      padding-left: 19px;
      font-size: 10.5px;
      line-height: 1.25;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.16s ease;
    }

    .fp-readout.is-active {
      color: var(--ink-primary);
    }

    .fp-readout strong {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--bamboo-3);
    }



    /* Strict 1:1 Square GitHub Heatmap Container */
    .fp-canvas {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    .gh-graph {
      display: inline-flex;
      flex-direction: column;
      gap: 3px;
    }

    .gh-months-row {
      display: flex;
      align-items: flex-end;
      padding-left: 19px; /* matches weekday axis width + gap */
    }

    .gh-months {
      display: grid;
      grid-template-columns: repeat(53, var(--cell-size));
      column-gap: var(--cell-gap);
      height: 11px;
      align-items: end;
    }

    .gh-mlbl {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--ink-muted);
      line-height: 1;
      white-space: nowrap;
      overflow: visible;
    }

    .gh-body {
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .gh-weekdays {
      width: 14px;
      display: grid;
      grid-template-rows: repeat(7, var(--cell-size));
      row-gap: var(--cell-gap);
      flex-shrink: 0;
    }

    .gh-wday {
      font-size: 9.5px;
      color: var(--ink-muted);
      line-height: var(--cell-size);
      text-align: right;
      user-select: none;
    }

    .gh-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, var(--cell-size));
      grid-template-columns: repeat(53, var(--cell-size));
      gap: var(--cell-gap);
    }

    .heat-sq {
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: 2px;
      background-color: var(--bamboo-0);
      outline: 1px solid rgba(29, 27, 24, 0.05);
      outline-offset: -1px;
      transition: transform 0.14s ease, box-shadow 0.16s ease;
    }

    .heat-sq.is-future {
      visibility: hidden;
      pointer-events: none;
    }

    .heat-sq.lvl-1 { background-color: var(--bamboo-1); }
    .heat-sq.lvl-2 { background-color: var(--bamboo-2); }
    .heat-sq.lvl-3 { background-color: var(--bamboo-3); }

    .heat-sq.is-clickable {
      cursor: pointer;
    }

    .heat-sq:hover {
      transform: scale(1.22);
      z-index: 4;
      box-shadow: 0 0 0 1px rgba(29, 27, 24, 0.36);
    }

    /* Crisp dark bamboo focus ring when linked from hovered twig above */
    .heat-sq.is-linked-sq {
      transform: scale(1.28);
      z-index: 6;
      box-shadow: 0 0 0 1.5px var(--paper), 0 0 0 3px var(--bamboo-3);
    }

    /* RIGHT: 最近发布 */
    .dock-latest {
      border-left: 1px solid var(--hairline);
      padding: 8px 0 8px clamp(16px, 2vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    /* Single-post mode (Stage 1) */
    .latest-post-btn {
      appearance: none;
      border: none;
      background: transparent;
      text-align: left;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .latest-post-title {
      font-family: var(--font-serif);
      font-size: clamp(12.8px, 1.08vw, 14px);
      font-weight: 600;
      color: var(--ink-primary);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.16s ease;
    }

    .latest-post-btn:hover .latest-post-title {
      color: var(--bamboo-4);
    }

    .latest-post-era {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--bamboo-4);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .latest-footer-meta {
      padding-top: 6px;
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      font-size: 10.5px;
      color: var(--ink-muted);
      min-width: 0;
    }

    .reading-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .reading-line strong {
      font-weight: 500;
      color: var(--ink-secondary);
    }

    /* Multi-post recent list (Stage 2 & 3) */
    .recent-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
      min-width: 0;
    }

    .recent-item-btn {
      appearance: none;
      border: none;
      background: transparent;
      width: 100%;
      padding: 4px 6px;
      margin: 0 -6px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      min-width: 0;
      transition: background-color 0.15s ease;
    }

    .recent-item-btn:hover {
      background-color: var(--bamboo-wash);
    }

    .recent-item-title {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 12.2px;
      font-weight: 500;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.15s ease;
    }

    .recent-item-btn:hover .recent-item-title {
      color: var(--bamboo-4);
    }

    .recent-item-date {
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--ink-muted);
    }

    /* -------------------------------------------------------------------------
       BAND 4: ULTRA-SLIM BOTTOM COLOPHON (~28px)
       ------------------------------------------------------------------------- */
    .colophon {
      flex: 0 0 var(--colophon-h);
      height: var(--colophon-h);
      padding: 0 var(--page-px);
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 10.5px;
      color: var(--ink-muted);
      background-color: var(--paper);
      overflow: hidden;
    }

    .colophon-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex: 1 1 auto;
    }


    /* Quiet Floating Tooltip (Planned twigs & Heatmap squares) */
    .quiet-tip {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.14s ease, transform 0.14s ease;
      background-color: var(--ink-primary);
      color: var(--paper);
      padding: 5px 9px;
      border-radius: 4px;
      font-size: 10.5px;
      line-height: 1.45;
      max-width: 320px;
    }

    .quiet-tip.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .qt-meta {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: #C9C2B6;
      margin-bottom: 1px;
    }

    /* =========================================================================
       4. ARTICLE READER VIEW (Scrollable Editorial Page)
       ========================================================================= */
    .reader-view {
      flex: 1 1 auto;
      flex-direction: column;
      background-color: var(--paper);
      animation: pageIn 0.24s var(--ease-out);
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .reader-bar {
      position: sticky;
      top: var(--nav-h);
      z-index: 20;
      height: 42px;
      padding: 0 var(--page-px);
      background-color: rgba(250, 248, 244, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .back-link {
      appearance: none;
      border: none;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--ink-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .back-link:hover {
      color: var(--ink-primary);
      transform: translateX(-2px);
    }

    .coord-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--bamboo-4);
      background-color: var(--bamboo-wash);
      padding: 2.5px 9px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reader-body {
      width: 100%;
      max-width: 710px;
      margin: 0 auto;
      padding: 40px 24px 88px;
    }

    .art-meta {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-muted);
      margin-bottom: 12px;
    }

    .art-h1 {
      font-family: var(--font-serif);
      font-size: clamp(23px, 2.8vw, 30px);
      font-weight: 600;
      line-height: 1.42;
      color: var(--ink-primary);
      margin-bottom: 16px;
    }

    /* Multi-post Node / Same-day Series Switcher inside Reader & Archive Sub-list */
    .node-series-box {
      margin-bottom: 20px;
      padding: 11px 14px;
      background-color: rgba(230, 239, 232, 0.45);
      border: 1px solid rgba(45, 106, 71, 0.20);
      border-radius: 6px;
    }

    .node-series-head {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--bamboo-4);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .node-series-tabs {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .series-tab-btn {
      appearance: none;
      border: 1px solid transparent;
      background-color: rgba(250, 248, 244, 0.65);
      border-radius: 4px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--ink-secondary);
      transition: all 0.16s ease;
    }

    .series-tab-btn:hover {
      background-color: var(--paper);
      color: var(--ink-primary);
      border-color: var(--hairline-mid);
    }

    .series-tab-btn.is-current {
      background-color: var(--paper);
      border-color: rgba(45, 106, 71, 0.34);
      color: var(--ink-primary);
      font-weight: 500;
    }

    .series-tab-date {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .archive-subposts {
      margin-top: 7px;
      padding-left: 11px;
      border-left: 1px solid rgba(45, 106, 71, 0.25);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .archive-subpost-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 3px 6px;
      margin-left: -6px;
      border-radius: 3px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      color: var(--ink-secondary);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .archive-subpost-btn:hover {
      background-color: rgba(45, 106, 71, 0.10);
      color: var(--bamboo-4);
    }

    .archive-subpost-date {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--ink-muted);
      flex-shrink: 0;
    }

    .art-lead {
      font-size: 14.5px;
      line-height: 1.8;
      color: var(--ink-secondary);
      padding: 13px 17px;
      background-color: var(--stone-surface);
      border-left: 2px solid var(--bamboo-4);
      border-radius: 0 4px 4px 0;
      margin-bottom: 32px;
    }

    .art-prose {
      font-size: 15px;
      line-height: 1.9;
      color: #2B2925;
    }

    .art-prose p {
      margin-bottom: 17px;
    }

    .art-prose h2 {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 600;
      color: var(--ink-primary);
      margin: 34px 0 13px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--hairline);
    }

    .art-prose h3 {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink-primary);
      margin: 22px 0 9px;
    }

    .art-prose ul {
      margin: 0 0 18px 20px;
    }

    .art-prose li {
      margin-bottom: 8px;
    }

    .art-prose strong {
      color: var(--ink-primary);
      font-weight: 600;
    }

    .art-prose code {
      font-family: var(--font-mono);
      font-size: 12.8px;
      background-color: var(--stone-surface);
      padding: 1px 5px;
      border-radius: 3px;
      color: var(--bamboo-4);
    }

    .art-prose pre {
      margin: 20px 0 24px;
      padding: 16px 18px;
      background-color: #22201D;
      color: #EDE9E0;
      border-radius: 6px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.65;
    }

    .art-prose pre code {
      background: transparent;
      color: inherit;
      padding: 0;
      font-size: inherit;
    }

    .c-cmt { color: #8B9B8E; }
    .c-kw  { color: #A0C6AB; }
    .c-str { color: #E2BA8A; }
    .c-fn  { color: #DDD5C7; }

    .art-hr {
      border: none;
      border-top: 1px solid var(--hairline);
      margin: 32px 0 24px;
    }

    .art-foot-nav {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .outline-btn {
      appearance: none;
      border: 1px solid var(--hairline-mid);
      background-color: var(--paper);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease;
    }

    .outline-btn:hover {
      background-color: var(--stone-surface);
      border-color: var(--hairline-strong);
    }

    /* =========================================================================
       5. 「全部文章」 ARCHIVE VIEW (Grouped by Era)
       ========================================================================= */
    .archive-view,
    .about-view {
      flex: 1 1 auto;
      flex-direction: column;
      align-items: center;
      padding: 38px 24px 80px;
      animation: pageIn 0.24s var(--ease-out);
    }

    .narrow-container {
      width: 100%;
      max-width: 780px;
    }

    .subpage-head {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 26px;
    }

    .subpage-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 6px;
    }

    .subpage-desc {
      font-size: 12.5px;
      color: var(--ink-muted);
    }

    .era-group {
      margin-bottom: 30px;
    }

    .era-group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 6px;
    }

    .era-group-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--ink-primary);
      display: inline-flex;
      align-items: baseline;
      gap: 9px;
    }

    .era-group-num {
      font-size: 19px;
      font-weight: 400;
      color: var(--ink-muted);
    }

    .era-group-period {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-muted);
    }

    .archive-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 10px;
      padding: 11px 10px;
      margin: 0 -10px;
      border-bottom: 1px solid var(--hairline);
      border-radius: 4px;
      transition: background-color 0.16s ease;
    }

    .archive-item.is-published {
      cursor: pointer;
    }

    .archive-item.is-published:hover {
      background-color: var(--bamboo-wash);
    }

    .archive-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }

    .archive-item.is-published .archive-dot {
      background-color: var(--bamboo-4);
    }

    .archive-item.is-flagship .archive-dot {
      background-color: var(--vermilion);
    }

    .archive-item.is-planned .archive-dot {
      border: 1.2px solid var(--ink-hollow);
      background-color: var(--paper);
    }

    .archive-item-title {
      font-family: var(--font-serif);
      font-size: 14.5px;
      color: var(--ink-primary);
      font-weight: 500;
    }

    .archive-item.is-planned .archive-item-title {
      color: var(--ink-planned);
      font-weight: 400;
    }

    .archive-item-sub {
      font-size: 11.5px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .archive-status {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
    }

    .archive-item.is-published .archive-status {
      color: var(--bamboo-4);
    }

    /* =========================================================================
       6. 「关于」 ABOUT VIEW & COPYABLE AGENT_MAP_DATA JSON
       ========================================================================= */
    .about-text {
      font-size: 14.5px;
      line-height: 1.88;
      color: var(--ink-secondary);
      margin-bottom: 26px;
    }

    .about-text p {
      margin-bottom: 13px;
    }

    .about-text strong {
      color: var(--ink-primary);
      font-weight: 600;
    }

    .json-box-wrap {
      border: 1px solid var(--hairline-mid);
      border-radius: 6px;
      overflow: hidden;
      background-color: var(--stone-surface);
    }

    .json-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .json-label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-primary);
    }

    .copy-btn {
      appearance: none;
      border: 1px solid var(--hairline-mid);

      function esc(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function toISO(dt) {
        const y = dt.getFullYear();
        const m = String(dt.getMonth() + 1).padStart(2, "0");
        const d = String(dt.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }


      function getPublishedPostsForNode(node) {
        return node.posts
          .filter((p) => p.pubStage <= state.stage)
          .sort((a, b) => (a.date < b.date ? 1 : -1));

      function isPublished(node) {
        return getPublishedPostsForNode(node).length > 0;

        return getPublishedPostsForNode(node).some((p) => p.isFlagship);
      }

      function getAllPublishedPosts() {
        const list = [];
        ALL_NODES.forEach((node) => {
          getPublishedPostsForNode(node).forEach((p) => list.push(p));

        return list.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : a.id < b.id ? 1 : -1));
      }

            return { node: post.node, post };
          }
        }
        if (NODE_MAP.has(targetId)) {
          const node = NODE_MAP.get(targetId);
          const pubs = getPublishedPostsForNode(node);
          if (pubs.length > 0) {
            const flagship = pubs.find((p) => p.isFlagship);
            return { node, post: flagship || pubs[0] };
          }
        }
        return null;

            iso,
            year: dt.getFullYear(),
            month: dt.getMonth() + 1,
            isFuture: iso > TODAY_ISO,
            count: 0,
            level: 0,
            posts: []
          };
          days.push(rec);
          dayMap.set(iso, rec);
        }

        const publishedPosts = getAllPublishedPosts();
        publishedPosts.forEach((post) => {
          const rec = dayMap.get(post.date);
          if (rec && !rec.isFuture) {
            rec.posts.push(post);
            rec.count = rec.posts.length;
            rec.level = rec.count >= 3 ? 3 : rec.count;
          }
        });

        return {
          days,
          dayMap,
          pubPostCount: publishedPosts.length
        };
      }

      function renderFlagshipEssay(post, seriesHtml) {
        return `
          <div class="art-meta">

            <span>·</span>
            <span>实文刊载</span>
          </div>
          <h1 class="art-h1">${esc(post.title)}</h1>
          ${seriesHtml}
          <p class="art-lead">${esc(post.summary)}</p>

          <div class="art-prose">
            <p>
              最近在复盘 Agent 开发框架时，看到一句很常见的话：<strong>“普通 LangChain 是一条直线走到黑的固定链路”</strong>。
            </p>
            <p>
              说实话，我一开始完全无法理解这句话。在我印象里，LangChain 不就是一个封装了各种好用 API 的“工具箱”吗（调 LLM、封装 Tool 都在里面）？而且大家都是写 Python 的，想要路由我写个 <code>if</code> 不行吗？想要循环我手搓个 <code>while</code> 跑 ReAct 不也挺香吗？凭什么说它是一条死板的直线？
            </p>
            <p>
              顺着这个疑问一路深挖下去，我才发现自己之前只是停留在“调 API 跑通 Demo”的层面，漏掉了好几层工程背景。把这些拼图补齐后，整个 AI 框架的演进逻辑瞬间就通透了。
            </p>

            <h2>一、先分清一件事：“乐高积木” vs “拼装方式”</h2>
            <p>如果把开发比作拼乐高，我之所以一开始觉得别扭，是因为把 LangChain 里的两个概念混在了一起：</p>
            <ul>
              <li><strong>工具箱（零件库）</strong>：是我们熟悉的那些组件，比如提示词模板、大模型接口、工具封装。它们是一个个独立的积木块。</li>
              <li><strong>Chain（拼装方式）</strong>：是 LangChain 最早力推的一种拼法——通过 <code>|</code>（管道符）把积木<strong>排成一排</strong>首尾相连。</li>
            </ul>
            <p>
              大家吐槽的“一条直线走到黑”，其实特指这种<strong>用 <code>|</code> 串起来的流水线写法</strong>——数据只能单向往前走，中间没法拐弯，也没法回头重试。而后来推出的 LangGraph，本质上是换了一种<strong>能拐弯、能画圈的拼法</strong>，里面塞的零件依然是 LangChain 工具箱里的那套 API。
            </p>

            <h2>二、灵魂拷问：为什么非要用 <code>|</code> 框死自己，直接写 <code>if</code> 和 <code>while</code> 不香吗？</h2>
            <p>
              从“拿来就能用”的业务视角看，<code>|</code> 的核心爽点就一句话：<strong>“逻辑只写一遍，运行模式一键切换”</strong>。把几个零件用 <code>|</code> 串起来交给框架统一调度后，线上最常用的 4 种工程能力，换个后缀名就能<strong>直接白嫖</strong>：
            </p>

<pre><code><span class="c-kw">from</span> langchain_core.prompts <span class="c-kw">import</span> ChatPromptTemplate
<span class="c-kw">from</span> langchain_openai <span class="c-kw">import</span> ChatOpenAI
<span class="c-kw">from</span> langchain_core.output_parsers <span class="c-kw">import</span> StrOutputParser

<span class="c-cmt"># 核心逻辑只写这一遍</span>
chain = (
    ChatPromptTemplate.from_template(<span class="c-str">"用一句话夸夸{topic}"</span>)
    | ChatOpenAI()
    | StrOutputParser()
)

<span class="c-cmt"># 1. 正常用：等它全部生成完吐出来</span>
print(chain.<span class="c-fn">invoke</span>({<span class="c-str">"topic"</span>: <span class="c-str">"摸鱼"</span>}))

<span class="c-cmt"># 2. 网页“打字机效果”：直接换 .stream()，不用改任何解析代码</span>
<span class="c-kw">for</span> chunk <span class="c-kw">in</span> chain.<span class="c-fn">stream</span>({<span class="c-str">"topic"</span>: <span class="c-str">"摸鱼"</span>}):
    print(chunk, end=<span class="c-str">""</span>, flush=<span class="c-kw">True</span>)

<span class="c-cmt"># 3. 批量处理一堆数据：直接换 .batch()，框架自动并发跑完</span>
results = chain.<span class="c-fn">batch</span>([{<span class="c-str">"topic"</span>: <span class="c-str">"摸鱼"</span>}, {<span class="c-str">"topic"</span>: <span class="c-str">"下班"</span>}, {<span class="c-str">"topic"</span>: <span class="c-str">"发工资"</span>}])

<span class="c-cmt"># 4. 怕大模型 API 偶尔抽风：套个 .with_retry()，失败自动重试 3 次</span>
safe_chain = chain.<span class="c-fn">with_retry</span>(stop_after_attempt=3)</code></pre>

            <p>
              要是全用原生 Python 自己写，从单次调用改成全链路流式、并发批处理加失败重试，得折腾一堆胶水代码；用 Chain 就只是换个词的事，本质上是把直线流程里的工程脏活全自动化的偷懒神器。
            </p>

            <h2>三、为什么手搓 <code>while</code> 扛不住真正的 Agent？</h2>
            <p>既然本地写个 <code>while</code> 循环就能跑通 ReAct（思考 → 调工具 → 继续思考 → 输出），为什么后来还要搞出状态机框架 LangGraph？绕不开两个现实痛点：</p>

            <h3>1. 早期的“焊死黑盒”不好干预</h3>
            <p>
              早年 LangChain 把 <code>while</code> 循环打包进 <code>AgentExecutor</code> 黑盒里。真到业务中你想让它“准备调用高危工具前先停下来等我确认”，盒子是焊死的，根本伸不进手去改。
            </p>

            <h3>2. 本地跑脚本 vs 线上跑服务（无状态架构）</h3>
            <p>
              这才是 LangGraph 最核心的价值。假如你的 Agent 跑到一半触发了 <strong>Human-in-the-loop（人工介入）</strong>，停下来等审批，但审批人<strong>两天后</strong>才点同意。本地 <code>while</code> 循环不可能一直卡在服务器内存里干等两天——线上服务必须是<strong>无状态</strong>的，不能靠内存死记进度。
            </p>
            <p>
              LangGraph 用<strong>状态机 + Checkpointer（检查点）</strong>优雅地解决了这个问题，就像打游戏的<strong>存档与读档</strong>：
            </p>
            <ul>
              <li>跑到需要人工确认的节点时，把当前全部状态（State）“存档”进数据库，程序直接退出释放资源；</li>
              <li>两天后点击同意，系统再从数据库“读档”复活，无缝接着往下跑。</li>
            </ul>

            <h2>四、终极悟道：不是当年框架没设计好，而是时代变了</h2>
            <p>复盘到最后，我终于理顺了 AI 框架演进的底层因果线：<strong>模型的能力上限，决定了框架的形态。</strong></p>
            <ul>
              <li><strong>Chain 时代（GPT-3 / 3.5 时期）</strong>：模型还不够聪明，自己循环试错动不动陷入死循环，连 RAG 也是闭眼硬搜的 Naive RAG。在那个阶段，一条直线的 Chain 完全够用。</li>
              <li><strong>Graph / Agent 时代</strong>：推理与 Function Calling 成熟后，大模型终于够格当大脑自己做决策。RAG 进化成会意图路由与重写的 Agentic RAG，Agent 也需要反思、纠错与持久化存档，这才催生了把循环、路由和存档全部摊开给你画的 LangGraph。</li>
            </ul>

            <hr class="art-hr" />
            <p>
              <strong>写在最后：</strong>现在 AI 迭代这么快，真正值钱的不是背 API，而是搞清楚每个架构设计背后到底在解决什么业务痛点、什么时候该搬出哪套工具，剩下的具体代码完全可以放心交给 AI 协作完成。
            </p>
          </div>
        `;
      }

      function renderNotePreview(post, seriesHtml) {
        const node = post.node;
        const pts = (post.points || []).map((p) => `<li>${esc(p)}</li>`).join("");
        return `
          <div class="art-meta">
            <span>${post.date}</span>
            <span>·</span>
            <span>约 ${post.readTime}</span>
            <span>·</span>
            <span>${esc(node.kw)}</span>
          </div>
          <h1 class="art-h1">${esc(post.title)}</h1>
          ${seriesHtml}
          <p class="art-lead">${esc(post.summary)}</p>

          <div class="art-prose">
            <h2>一、演进坐标</h2>
            <p>
              本篇手札归属演进图谱节点 <strong>${node.era.num} ${esc(node.era.title)}（${esc(node.era.year)}）› ${esc(node.title)}</strong>。在这一阶段，行业围绕「${esc(node.era.whisper)}」完成了关键跃迁。
            </p>
            <h2>二、核心要点</h2>
            <ul>${pts}</ul>
            <h2>三、选型自查</h2>
            <p>
              在真实产品中引入 <strong>${esc(node.kw)}</strong> 之前，始终回到“可控性 ↔ 自主性”的根本权衡：能用更简单方案稳稳交付的，绝不为追新名词增加额外复杂度与 Token 损耗。
            </p>
          </div>
        `;
      }

      function openArticle(targetId, options) {
        const resolved = resolveTarget(targetId);
        if (!resolved) return;

        const { node, post } = resolved;
        state.lastReadNodeId = node.id;

        const opts = options || {};
        let sameDayPosts = null;
        if (opts.fromDate) {
          const rec = footprint.dayMap.get(opts.fromDate);
          if (rec && rec.posts.length > 1) {
            sameDayPosts = rec.posts;
          }
        }

        const pubs = getPublishedPostsForNode(node);
        const seriesSuffix = pubs.length > 1 ? ` · 共 ${pubs.length} 篇` : "";
        readerCoordTagEl.textContent = `${node.era.num} ${node.era.title} › ${node.title}${seriesSuffix}`;

        const seriesHtml = buildSeriesSwitcherHTML(node, post, sameDayPosts);
        const html = post.isFlagship
          ? renderFlagshipEssay(post, seriesHtml)
          : renderNotePreview(post, seriesHtml);

        const allPosts = getAllPublishedPosts();
        const idx = allPosts.findIndex((p) => p.id === post.id);
        const nextPost = allPosts.length > 1 ? allPosts[(idx + 1) % allPosts.length] : null;

        readerBodyEl.innerHTML =
          html +
          `<div class="art-foot-nav">
            <button class="outline-btn" type="button" id="foot-back-map">← 返回演进图谱</button>
            ${
              nextPost
                ? `<button class="outline-btn" type="button" data-open-article="${nextPost.id}">下一篇：${esc(nextPost.shortTitle)} →</button>`
                : ""
            }
          </div>`;

        switchView("reader");
        window.scrollTo({ top: 0, behavior: "instant" });

        const footBtn = document.getElementById("foot-back-map");
        if (footBtn) {
          footBtn.addEventListener("click", () => returnToHomeWithAfterglow());
        }
      }

      /* =======================================================================
         6. VIEW SWITCHING & RETURN AFTERGLOW FEEDBACK
         ======================================================================= */
      function triggerReturnAfterglow(nodeId) {
        if (!nodeId) return;
        if (state.afterglowTimer) {
          clearTimeout(state.afterglowTimer);
          state.afterglowTimer = null;
        }
        skeletonGridEl.querySelectorAll(".twig-row.is-just-read").forEach((el) => {
          el.classList.remove("is-just-read");
        });

        const row = skeletonGridEl.querySelector(`.twig-row[data-node-id="${nodeId}"]`);
        if (!row) return;

        row.scrollIntoView({ block: "nearest" });
        void row.offsetWidth;
        row.classList.add("is-just-read");

        state.afterglowTimer = setTimeout(() => {
          row.classList.remove("is-just-read");
          state.afterglowTimer = null;
        }, 1250);
      }

      function returnToHomeWithAfterglow() {
        const lastId = state.lastReadNodeId;
        switchView("home");
        if (lastId) {
          requestAnimationFrame(() => {
            updateColumnScrollMasks();
            triggerReturnAfterglow(lastId);
          });
        }
      }

      function switchView(nextView) {
        state.view = nextView;
        document.body.classList.toggle("view-home", nextView === "home");

        Object.keys(views).forEach((k) => {
          views[k].classList.toggle("is-visible", k === nextView);
        });

        navLinksEl.querySelectorAll(".nav-btn").forEach((btn) => {
          btn.classList.toggle("is-active", btn.dataset.view === nextView);
        });

        clearHoverLinks();
        hideTip();
        if (nextView === "home") requestAnimationFrame(updateColumnScrollMasks);
        if (nextView === "articles") renderArchive();
        if (nextView === "about") renderAbout();
      }

      /* =======================================================================
         7. BIDIRECTIONAL BRUSHING & LINKING + QUIET TOOLTIP
         ======================================================================= */
      function clearHoverLinks() {
        document
          .querySelectorAll(".is-linked-era, .is-linked-twig, .is-linked-sq")
          .forEach((el) => el.classList.remove("is-linked-era", "is-linked-twig", "is-linked-sq"));
      }

      function resetReadout() {
        fpReadoutEl.classList.remove("is-active");
        fpReadoutEl.innerHTML = defaultReadoutHTML();
      }

      function showTip(html, targetEl) {
        tipEl.innerHTML = html;
        tipEl.classList.add("is-visible");

        const r = targetEl.getBoundingClientRect();
        const tr = tipEl.getBoundingClientRect();
        const pad = 10;

        let left = r.left + r.width / 2 - tr.width / 2;
        left = Math.max(pad, Math.min(window.innerWidth - tr.width - pad, left));

        let top = r.top - tr.height - 8;
        if (top < pad) top = r.bottom + 8;

        tipEl.style.left = `${left}px`;
        tipEl.style.top = `${top}px`;
      }

      function hideTip() {
        tipEl.classList.remove("is-visible");
      }

      function highlightFromTwig(nodeId) {
        clearHoverLinks();
        const node = NODE_MAP.get(nodeId);
        if (!node) return;
        const pubs = getPublishedPostsForNode(node);
        if (pubs.length === 0) return;

        pubs.forEach((p) => {
          const sq = fpCanvasEl.querySelector(`.heat-sq[data-iso="${p.date}"]`);
          if (sq) sq.classList.add("is-linked-sq");
        });

        fpReadoutEl.classList.add("is-active");
        if (pubs.length > 1) {
          fpReadoutEl.innerHTML = `<strong>${esc(node.title)}</strong> · 收录 <strong>${pubs.length}</strong> 篇（最新 ${pubs[0].date}）`;
        } else {
          fpReadoutEl.innerHTML = `<strong>${pubs[0].date}</strong> · 发布《${esc(pubs[0].shortTitle)}》`;
        }
      }

      function highlightFromSquare(dayRec) {
        clearHoverLinks();
        if (!dayRec || dayRec.isFuture) {
          resetReadout();
          return;
        }

        if (dayRec.count === 0) {
          fpReadoutEl.classList.add("is-active");
          fpReadoutEl.innerHTML = `${dayRec.iso} · 无发布`;
          return;
        }

        const titles = dayRec.posts.map((p) => `《${esc(p.shortTitle)}》`).join("");
        dayRec.posts.forEach((p) => {
          const node = p.node;
          if (node && isPublished(node)) {
            const eraEl = skeletonGridEl.querySelector(`.era-col[data-era-id="${node.era.id}"]`);
            const twigEl = skeletonGridEl.querySelector(`.twig-item[data-node-id="${node.id}"]`);
            if (eraEl) eraEl.classList.add("is-linked-era");
            if (twigEl) twigEl.classList.add("is-linked-twig");
          }
        });

        fpReadoutEl.classList.add("is-active");
        fpReadoutEl.innerHTML = `<strong>${dayRec.iso}</strong> · 发布 ${dayRec.count} 篇：${titles}`;
      }

      /* =======================================================================
         8. MASTER RENDER & EVENT LISTENERS
         ======================================================================= */
      function renderAll() {
        footprint = buildFootprint();
        renderSkeleton();
        renderFootprint();
        renderLatestDock();
        if (state.view === "articles") renderArchive();
        if (state.view === "about") renderAbout();
      }

      navLinksEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".nav-btn[data-view]");
        if (!btn) return;
        switchView(btn.dataset.view);
      });

      // Twig & Sub-twig Hover
      skeletonGridEl.addEventListener("mouseover", (e) => {
        const subBtn = e.target.closest(".sub-twig-btn[data-open-article]");
        if (subBtn) {
          const post = POST_MAP.get(subBtn.dataset.openArticle);
          if (post) {
            clearHoverLinks();
            const sq = fpCanvasEl.querySelector(`.heat-sq[data-iso="${post.date}"]`);
            if (sq) sq.classList.add("is-linked-sq");
            fpReadoutEl.classList.add("is-active");
            fpReadoutEl.innerHTML = `<strong>${post.date}</strong> · 发布《${esc(post.shortTitle)}》`;
          }
          hideTip();
          return;
        }

        const row = e.target.closest(".twig-row[data-node-id]");
        if (!row) return;
        const node = NODE_MAP.get(row.dataset.nodeId);
        if (!node) return;

        const pubs = getPublishedPostsForNode(node);
        if (pubs.length > 0) {
          highlightFromTwig(node.id);
          showTip(
            `<div class="qt-meta">${esc(node.milestone)}</div><div>已收录 ${pubs.length} 篇 · 点击折叠/展开</div>`,
            row
          );
        } else {
          clearHoverLinks();
          resetReadout();
          showTip(`<div class="qt-meta">${esc(node.milestone)}</div><div>待研写 · 规划节点</div>`, row);
        }
      });

      skeletonGridEl.addEventListener("mouseout", (e) => {
        if (!skeletonGridEl.contains(e.relatedTarget)) {
          clearHoverLinks();
          resetReadout();
          hideTip();
        } else {
          const leftRow = e.target.closest(".twig-row, .sub-twig-btn");
          const enteredRow = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".twig-row, .sub-twig-btn");
          if (leftRow && !enteredRow) {
            clearHoverLinks();
            resetReadout();
            hideTip();
          }
        }
      });

      // Twig Click: single-post opens immediately; multi-post toggles collapse/expand
      skeletonGridEl.addEventListener("click", (e) => {
        const subBtn = e.target.closest(".sub-twig-btn[data-open-article]");
        if (subBtn) {
          openArticle(subBtn.dataset.openArticle);
          return;
        }

        const row = e.target.closest(".twig-row[data-node-id]");
        if (!row) return;
        const node = NODE_MAP.get(row.dataset.nodeId);
        if (!node) return;

        const pubs = getPublishedPostsForNode(node);
        if (pubs.length === 0) return;

        const itemEl = row.closest(".twig-item");
        const collapsed = state.collapsedNodes.has(node.id);
        if (collapsed) {
          state.collapsedNodes.delete(node.id);
        } else {
          state.collapsedNodes.add(node.id);
        }
        if (itemEl) {
          itemEl.classList.toggle("is-collapsed", !collapsed);
          const badge = itemEl.querySelector(".twig-badge");
          if (badge) {
            badge.textContent = !collapsed ? "▸" : "▾";
          }
        }
        requestAnimationFrame(updateColumnScrollMasks);
      });

      // GitHub Heatmap Hover & Click
      fpCanvasEl.addEventListener("mouseover", (e) => {
        const sq = e.target.closest(".heat-sq[data-iso]");
        if (!sq) return;
        const rec = footprint.dayMap.get(sq.dataset.iso);
        if (!rec || rec.isFuture) return;

        highlightFromSquare(rec);
        if (rec.count > 0) {
          const titles = rec.posts.map((p) => `《${esc(p.shortTitle)}》`).join("");
          showTip(
            `<div class="qt-meta">${rec.iso} · 发布 ${rec.count} 篇</div><div>${titles}</div>`,
            sq
          );
        } else {
          showTip(`<div>${rec.iso} · 无发布</div>`, sq);
        }
      });

      fpCanvasEl.addEventListener("mouseout", (e) => {
        if (!fpCanvasEl.contains(e.relatedTarget)) {
          clearHoverLinks();
          resetReadout();
          hideTip();
        }
      });

      fpCanvasEl.addEventListener("click", (e) => {
        const sq = e.target.closest(".heat-sq[data-pub-date]");
        if (!sq) return;
        const rec = footprint.dayMap.get(sq.dataset.pubDate);
        if (!rec || rec.posts.length === 0) return;

        openArticle(rec.posts[0].id, { fromDate: rec.iso });
      });

      // Delegated clicks for Recent Posts, Archive rows, Reader next button & Series switchers
      document.addEventListener("click", (e) => {
        const switchBtn = e.target.closest("[data-switch-post]");
        if (switchBtn) {
          openArticle(switchBtn.dataset.switchPost, {
            fromDate: switchBtn.dataset.fromDate || null
          });
          return;
        }

        if (e.target.closest(".sub-twig-btn")) return;

        const trigger = e.target.closest("[data-open-article]");
        if (!trigger) return;
        openArticle(trigger.dataset.openArticle);
      });

      btnBackMapEl.addEventListener("click", () => returnToHomeWithAfterglow());

      window.addEventListener("resize", () => {
        if (state.view === "home") {
          requestAnimationFrame(updateColumnScrollMasks);
        }
      });

      // Copy JSON Skeleton
      btnCopyJsonEl.addEventListener("click", () => {
        const text = exportSkeletonJSON();
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);

          btnCopyJsonEl.classList.add("is-copied");
          btnCopyJsonEl.textContent = "已复制 JSON";
          setTimeout(() => {
            btnCopyJsonEl.classList.remove("is-copied");
            btnCopyJsonEl.textContent = "一键复制 JSON";
          }, 1800);
        } catch (err) {
          btnCopyJsonEl.textContent = "请手动选择复制";
        }
      });
